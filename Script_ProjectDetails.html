<script>
    // ==========================================
    // Read-only cloud panel HTML is cached by project and view only in memory.
    var projectCloudPanelCache = Object.create(null);
    var projectCloudPanelPending = Object.create(null);
    var cloudConnectionGeneration = 0;
    window.addEventListener('bimbot:cloud-connection-changed', function() {
        projectCloudPanelCache = Object.create(null);
        projectCloudPanelPending = Object.create(null);
        pilotSnapshotCache = Object.create(null);
        pilotSnapshotPending = Object.create(null);
    });

    function cloudPanelKey(projectNo, view) { return String(projectNo) + ':' + String(view); }
    function showCloudPanelResult(projectNo, view, result) {
        var frame = document.getElementById('cloud-' + view + '-frame');
        var message = document.getElementById('cloud-' + view + '-message');
        if (!frame || !message) return;
        frame.classList.add('hidden');
        message.classList.remove('hidden');
        if (!result || result.available !== true || typeof result.html !== 'string' || !result.html.trim()) {
            message.textContent = (result && (result.error || result.message)) || 'נתוני הענן עדיין אינם זמינים לפרויקט הזה.';
            return;
        }
        var renderKey = cloudPanelKey(projectNo, view);
        var rendered = frame.__bimbotCloudRender;
        if (!rendered || rendered.key !== renderKey || rendered.html !== result.html) {
            frame.srcdoc = result.html;
            frame.__bimbotCloudRender = { key: renderKey, html: result.html };
        }
        message.classList.add('hidden');
        frame.classList.remove('hidden');
    }
    function loadCloudPanel(view, forceReload) {
        var projectNo = state.selectedProject && state.selectedProject.no;
        if (!projectNo) return;
        var key = cloudPanelKey(projectNo, view);
        if (forceReload) delete projectCloudPanelCache[key];
        if (projectCloudPanelCache[key]) {
            showCloudPanelResult(projectNo, view, projectCloudPanelCache[key]);
            return;
        }
        if (projectCloudPanelPending[key]) return;
        var frame = document.getElementById('cloud-' + view + '-frame');
        var message = document.getElementById('cloud-' + view + '-message');
        if (frame) frame.classList.add('hidden');
        if (message) { message.classList.remove('hidden'); message.textContent = 'טוען צילום מצב של הפרויקט מהענן…'; }
        projectCloudPanelPending[key] = true;
        var requestGeneration = cloudConnectionGeneration;
        google.script.run.withSuccessHandler(function(result) {
            delete projectCloudPanelPending[key];
            if (requestGeneration !== cloudConnectionGeneration) return;
            projectCloudPanelCache[key] = result || { available: false };
            if (!state.selectedProject || String(state.selectedProject.no) !== String(projectNo)) return;
            showCloudPanelResult(projectNo, view, projectCloudPanelCache[key]);
        }).withFailureHandler(function(err) {
            delete projectCloudPanelPending[key];
            if (requestGeneration !== cloudConnectionGeneration) return;
            if (!state.selectedProject || String(state.selectedProject.no) !== String(projectNo)) return;
            if (frame) frame.classList.add('hidden');
            if (message) { message.classList.remove('hidden'); message.textContent = 'לא ניתן לטעון את צילום מצב הענן. ' + (err && err.message ? err.message : 'נסו לרענן את התצוגה.'); }
        }).getCloudPanel(projectNo, view);
    }
    function refreshCloudPanel(view) { loadCloudPanel(view, true); }

    window.addEventListener('message', function(event) {
        var knownFrames = ['issues'].map(function(view) { return document.getElementById('cloud-' + view + '-frame'); }).filter(Boolean);
        if (!knownFrames.some(function(frame) { return event.source === frame.contentWindow; })) return;
        var message = event.data;
        if (!message || message.type !== 'bimbot-cloud-navigate') return;
        if (message.page === 'models') {
            state.mdcCurrentStep = 4;
            switchTab('mdc');
            renderMdcStep(4);
        } else if (message.page === 'docs') {
            switchTab('kickoff');
        } else if (message.page === 'acc') {
            switchTab('home');
        }
    });

    var pilotSnapshotCache = Object.create(null);
    var pilotSnapshotPending = Object.create(null);
    var projectWorkflowDraft = { revision: null, stage: 'UNSET', tasks: [], writable: false, loading: false };
    var workflowTaskDrafts = Object.create(null);
    var workflowDirty = false;
    var workflowMessage = '';
    var workflowSaving = false;
    var workflowNextActionTab = '';
    var workflowNextActionTaskId = '';
    var workflowSavedStage = 'UNSET';
    var workflowStageDirty = false;
    var homeBrowseStage = 'INITIAL';
    var workflowStageObjectives = { INITIAL: 'הקמת בסיס הפרויקט, התנעת אדריכלות ויועצים, ובדיקת מוכנות ראשונית.', FINAL: 'הכנת ובדיקת מסירת התכנון לשלב מכרז; סבב הבקרה נשמר כתהליך ייעודי בעתיד.', DETAILED: 'בדיקת התכנון המפורט וסיכום הנחיות BIM לביצוע.' };
    var workflowActionTabs = { architect_meeting: 'architecture-kickoff', decomposition: 'mdc', cde_urs: 'bim-info', consultant_kickoff: 'consultant-kickoff' };
    var workflowActionLabels = { architect_meeting: 'פתיחת פגישת התנעה אדריכלית', decomposition: 'פתיחת מבנה הפרויקט והמודלים', cde_urs: 'פתיחת פרטי פרויקט', consultant_kickoff: 'פתיחת התנעת יועצים' };
    var workflowTaskDefinitions = {
        INITIAL: [
            ['architect_meeting', 'פגישת טרום התנעה עם האדריכלים'], ['decomposition', 'הקמת סכמת פירוק ורישום מודלים'],
            ['cde_urs', 'אימות CDE ו־URS'], ['architect_check', 'בדיקת מודל האדריכלות'], ['bep', 'אימות מסמך BEP'],
            ['consultant_kickoff', 'התנעת יועצים'], ['first_review', 'בקרה ראשונה ומעקב תיקונים']
        ],
        FINAL: [['tender_review', 'בקרה למכרז, דוח ומעקב תיקונים']],
        DETAILED: [['detailed_review', 'בדיקת תכנון מפורט'], ['stage_summary', 'סיכום שלב והנחיות BIM לביצוע']]
    };
    var workflowStageLabels = { UNSET: 'לא אומת · לא ידוע', INITIAL: 'תכנון ראשוני', FINAL: 'תכנון סופי / מכרז', DETAILED: 'תכנון מפורט' };
    var workflowStatusLabels = { NOT_STARTED: 'טרם התחיל', IN_PROGRESS: 'בעבודה', BLOCKED: 'חסום', DONE: 'הושלם בהחלטת מנהל' };

    function workflowTasksForStage(stage) {
        var existing = workflowTaskDrafts[stage] || Object.create(null);
        return (workflowTaskDefinitions[stage] || []).map(function(def) {
            var prior = existing[def[0]] || {};
            return { id: def[0], label: prior.label || def[1], stage: stage, status: prior.status || 'NOT_STARTED', note: prior.note || '', updatedAt: prior.updatedAt || '', updatedBy: prior.updatedBy || '' };
        });
    }
    function renderProjectWorkflow() {
        var stageSelect = document.getElementById('home-stage-select');
        var list = document.getElementById('home-task-list');
        var message = document.getElementById('home-workflow-message');
        var meta = document.getElementById('home-workflow-meta');
        var saveButton = document.getElementById('home-workflow-save');
        if (!list) return;
        if (stageSelect) { stageSelect.value = projectWorkflowDraft.stage || 'UNSET'; stageSelect.disabled = !projectWorkflowDraft.writable || projectWorkflowDraft.loading || workflowSaving; }
        list.textContent = '';
        if (projectWorkflowDraft.loading) {
            if (saveButton) saveButton.disabled = true;
            if (message) message.textContent = 'טוען החלטות מנהל שמורות…';
            return;
        }
        if (workflowMessage) {
            if (message) message.textContent = workflowMessage;
        } else if (projectWorkflowDraft.stage === 'UNSET') {
            if (message) message.textContent = 'לא נשמר שלב לפרויקט. בחרו שלב לאחר אימות עם מנהל הפרויקט.';
        } else if (message) {
            message.textContent = 'המשימות מציגות תהליך עבודה מוצע. עדכון מצב או סגירה דורשים החלטה מפורשת.';
        }
        if (!workflowStageLabels[homeBrowseStage]) homeBrowseStage = projectWorkflowDraft.stage !== 'UNSET' ? projectWorkflowDraft.stage : 'INITIAL';
        projectWorkflowDraft.tasks = ['INITIAL','FINAL','DETAILED'].reduce(function(all, stage) { return all.concat(workflowTasksForStage(stage)); }, []);
        renderWorkflowNextAction();
        renderHomeTimeline();
        ['INITIAL','FINAL','DETAILED'].forEach(function(stage) {
            var tasks = workflowTasksForStage(stage);
            tasks.forEach(function(task, index) {
                var row = document.createElement('tr'); row.dataset.phase = stage; row.dataset.taskId = task.id; row.dataset.highlight = homeBrowseStage === stage ? 'true' : 'false';
                if (index === 0) {
                    var phase = document.createElement('th'); phase.scope = 'rowgroup'; phase.rowSpan = tasks.length; phase.className = 'workflow-phase-cell';
                    var title = document.createElement('strong'); title.textContent = workflowStageLabels[stage]; phase.appendChild(title);
                    var completion = document.createElement('div'); completion.id = 'workflow-progress-' + stage; phase.appendChild(completion);
                    row.appendChild(phase);
                }
                var name = document.createElement('th'); name.scope = 'row'; name.textContent = task.label; row.appendChild(name);
                var statusCell = document.createElement('td');
                var select = document.createElement('select'); select.setAttribute('aria-label','מצב: ' + task.label);
                Object.keys(workflowStatusLabels).forEach(function(status) { var option = document.createElement('option'); option.value = status; option.textContent = workflowStatusLabels[status]; select.appendChild(option); });
                select.value = task.status; select.dataset.status = task.status; select.disabled = !projectWorkflowDraft.writable || workflowSaving;
                select.addEventListener('change', function() { task.status = select.value; select.dataset.status = task.status; rememberWorkflowTask(task); updateWorkflowTableProgress(); });
                statusCell.appendChild(select); row.appendChild(statusCell);
                var evidenceCell = document.createElement('td');
                var note = document.createElement('input'); note.type = 'text'; note.maxLength = 2000; note.value = task.note; note.placeholder = 'הערה / קישור לראיה'; note.title = task.note || 'טרם נרשמה ראיה'; note.setAttribute('aria-label','ראיה: ' + task.label); note.disabled = !projectWorkflowDraft.writable || workflowSaving;
                note.addEventListener('input', function() { task.note = note.value; note.title = note.value; rememberWorkflowTask(task); }); evidenceCell.appendChild(note); row.appendChild(evidenceCell);
                var audit = document.createElement('td'); audit.className = 'workflow-audit'; var date = task.updatedAt ? new Date(task.updatedAt) : null;
                audit.textContent = date && !isNaN(date.getTime()) ? new Intl.DateTimeFormat('he-IL',{dateStyle:'short'}).format(date) : 'טרם עודכן';
                audit.title = task.updatedBy ? task.updatedBy + ' · ' + task.updatedAt : 'אין החלטה מתועדת'; row.appendChild(audit);
                var action = document.createElement('td');
                if (workflowActionTabs[task.id]) { var button = document.createElement('button'); button.type = 'button'; button.textContent = 'פתיחה'; button.setAttribute('aria-label', workflowActionLabels[task.id]); button.addEventListener('click', function() { openWorkflowTaskAction(task.id); }); action.appendChild(button); }
                else { var existing = document.createElement('span'); existing.className = 'text-xs text-slate-400'; existing.textContent = 'מעקב בטבלה'; action.appendChild(existing); }
                row.appendChild(action); list.appendChild(row);
            });
        });
        updateWorkflowTableProgress();
        if (meta) meta.textContent = projectWorkflowDraft.writable ? ((workflowDirty ? 'יש שינויים שלא נשמרו · ' : '') + (projectWorkflowDraft.revision != null ? 'גרסה ' + projectWorkflowDraft.revision : 'טרם נשמר')) : 'מצב קריאה בלבד';
        var dirtyNotice = document.getElementById('home-decisions-dirty');
        if (dirtyNotice) dirtyNotice.classList.toggle('hidden', !workflowDirty);
        if (saveButton) { saveButton.disabled = !projectWorkflowDraft.writable || projectWorkflowDraft.loading || workflowSaving; saveButton.textContent = workflowSaving ? 'שומר…' : 'שמירת החלטות'; }
    }
    function updateWorkflowTableProgress() {
        ['INITIAL','FINAL','DETAILED'].forEach(function(stage) {
            var tasks = workflowTasksForStage(stage), done = tasks.filter(function(t) { return t.status === 'DONE'; }).length;
            var cell = document.getElementById('workflow-progress-' + stage);
            if (cell) cell.textContent = done + ' / ' + tasks.length + ' הושלמו';
        });
    }
    function renderHomeTimeline() {
        var host = document.getElementById('home-phase-timeline');
        var phaseStatus = document.getElementById('home-phase-status');
        if (!host) return;
        host.textContent = '';
        var savedStage = workflowSavedStage || 'UNSET';
        var pending = workflowStageDirty && projectWorkflowDraft.stage !== savedStage;
        if (phaseStatus) phaseStatus.textContent = savedStage === 'UNSET' ? (pending ? 'השלב לא אומת · בחירה ממתינה לשמירה' : 'השלב הנוכחי לא אומת') : 'השלב הנוכחי: ' + workflowStageLabels[savedStage] + (pending ? ' · שינוי ממתין לשמירה: ' + workflowStageLabels[projectWorkflowDraft.stage] : '');
        ['INITIAL', 'FINAL', 'DETAILED'].forEach(function(stage) {
            var tasks = workflowTasksForStage(stage);
            var done = tasks.length > 0 && tasks.every(function(task) { return task.status === 'DONE'; });
            var current = savedStage === stage;
            var card = document.createElement('button'); card.type = 'button'; card.setAttribute('role', 'tab'); card.setAttribute('aria-selected', homeBrowseStage === stage ? 'true' : 'false');
            card.className = 'home-phase-node relative flex flex-col items-center text-center transition';
            card.dataset.current = current ? 'true' : 'false'; card.dataset.complete = done ? 'true' : 'false';
            card.addEventListener('click', function() { homeBrowseStage = stage; renderProjectWorkflow(); });
            var badge = document.createElement('div'); badge.className = 'flex flex-col items-center';
            var dot = document.createElement('span'); dot.className = 'home-phase-dot mb-3 flex h-9 w-9 items-center justify-center rounded-full bg-slate-200 text-sm font-bold text-slate-700'; dot.textContent = done ? '✓' : String(['INITIAL','FINAL','DETAILED'].indexOf(stage) + 1); badge.appendChild(dot);
            var name = document.createElement('span'); name.className = 'text-sm font-bold text-slate-900'; name.textContent = workflowStageLabels[stage]; badge.appendChild(name);
            var state = document.createElement('span'); state.className = 'rounded-full px-2 py-1 text-[10px] font-bold ' + (done ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'); state.textContent = done ? 'כל המשימות הושלמו' : tasks.length ? tasks.filter(function(t) { return t.status === 'DONE'; }).length + ' מתוך ' + tasks.length + ' משימות' : 'אין משימות מוגדרות'; badge.appendChild(state); card.appendChild(badge);
            var hint = document.createElement('div'); hint.className = 'mt-2 text-xs text-slate-500'; hint.textContent = current ? 'השלב שנקבע' : (stage === homeBrowseStage ? 'מודגש בטבלה' : 'הדגשה בטבלה'); card.appendChild(hint);
            host.appendChild(card);
        });
    }
    function renderWorkflowNextAction() {
        var label = document.getElementById('home-next-action');
        var button = document.getElementById('home-next-action-button');
        var tasks = workflowTasksForStage(workflowSavedStage || 'UNSET');
        workflowNextActionTab = '';
        workflowNextActionTaskId = '';
        var task = tasks.find(function(item) { return item.status === 'BLOCKED'; }) || tasks.find(function(item) { return item.status === 'IN_PROGRESS'; }) || tasks.find(function(item) { return item.status === 'NOT_STARTED'; });
        if (!task) {
            if (label) label.textContent = workflowSavedStage === 'UNSET' ? 'יש לאמת שלב עבודה' : 'כל משימות השלב שנקבע סומנו כהושלמו';
            if (button) button.classList.add('hidden');
            return;
        }
        workflowNextActionTab = workflowActionTabs[task.id] || '';
        workflowNextActionTaskId = task.id;
        var stateLabel = task.status === 'BLOCKED' ? 'חסום' : task.status === 'IN_PROGRESS' ? 'בעבודה' : 'טרם התחיל';
        if (label) label.textContent = 'מוצע בשלב שנקבע · ' + stateLabel + ': ' + task.label;
        if (button) { button.textContent = workflowActionLabels[task.id] || ''; button.classList.toggle('hidden', !workflowNextActionTab); }
    }
    function openWorkflowTaskAction(taskId) {
        var tab = workflowActionTabs[taskId];
        if (!tab) return;
        if (tab === 'mdc') { state.mdcCurrentStep = 1; switchTab(tab); renderMdcStep(1); }
        else switchTab(tab);
    }
    function openWorkflowNextAction() {
        var task = (projectWorkflowDraft.tasks || []).find(function(item) { return item.id === workflowNextActionTaskId; });
        if (task) openWorkflowTaskAction(task.id);
    }
    function rememberWorkflowTask(task) {
        if (!workflowTaskDrafts[task.stage]) workflowTaskDrafts[task.stage] = Object.create(null);
        workflowTaskDrafts[task.stage][task.id] = task;
        workflowDirty = true;
        workflowMessage = '';
        renderWorkflowNextAction();
        renderHomeTimeline();
        var meta = document.getElementById('home-workflow-meta');
        if (meta) meta.textContent = 'יש שינויים שלא נשמרו · ' + (projectWorkflowDraft.revision != null ? 'גרסה ' + projectWorkflowDraft.revision : 'טרם נשמר');
        var dirtyNotice = document.getElementById('home-decisions-dirty');
        if (dirtyNotice) dirtyNotice.classList.remove('hidden');
    }
    function onWorkflowStageChange(stage) {
        if (!Object.prototype.hasOwnProperty.call(workflowStageLabels, stage)) return;
        workflowDirty = workflowDirty || projectWorkflowDraft.stage !== stage;
        projectWorkflowDraft.stage = stage;
        workflowStageDirty = stage !== workflowSavedStage;
        workflowMessage = '';
        renderProjectWorkflow();
        renderProjectHome();
    }
    function loadProjectWorkflow() {
        var p = state.selectedProject;
        projectWorkflowDraft = { revision: null, stage: 'UNSET', tasks: [], writable: false, loading: true };
        workflowTaskDrafts = Object.create(null); workflowDirty = false; workflowMessage = ''; workflowSaving = false; workflowSavedStage = 'UNSET'; workflowStageDirty = false;
        renderProjectWorkflow();
        if (!p || typeof google === 'undefined' || !google.script || !google.script.run) {
            projectWorkflowDraft.loading = false; renderProjectWorkflow(); return;
        }
        var projectNo = String(p.no);
        google.script.run.withSuccessHandler(function(res) {
            if (!state.selectedProject || String(state.selectedProject.no) !== projectNo) return;
            if (res && res.success) {
                projectWorkflowDraft = { revision: res.revision == null ? null : res.revision, stage: workflowStageLabels[res.stage] ? res.stage : 'UNSET', tasks: Array.isArray(res.tasks) ? res.tasks : [], writable: res.writable === true, loading: false };
                workflowSavedStage = projectWorkflowDraft.stage; workflowStageDirty = false;
                homeBrowseStage = projectWorkflowDraft.stage === 'UNSET' ? 'INITIAL' : projectWorkflowDraft.stage;
                projectWorkflowDraft.tasks.forEach(function(task) { var stage = task.stage || projectWorkflowDraft.stage; if (!workflowTaskDrafts[stage]) workflowTaskDrafts[stage] = Object.create(null); workflowTaskDrafts[stage][task.id] = task; });
                if (res.writable !== true) workflowMessage = 'הנתונים זמינים לקריאה בלבד' + (res.error ? ': ' + res.error : '.');
            } else { projectWorkflowDraft = { revision: null, stage: 'UNSET', tasks: [], writable: false, loading: false }; workflowMessage = (res && (res.error || res.message)) || 'לא ניתן לטעון את תמונת העבודה.'; }
            workflowDirty = false;
            renderProjectWorkflow(); renderProjectHome();
        }).withFailureHandler(function() {
            if (!state.selectedProject || String(state.selectedProject.no) !== projectNo) return;
            projectWorkflowDraft = { revision: null, stage: 'UNSET', tasks: [], writable: false, loading: false };
            workflowMessage = 'לא ניתן לטעון את החלטות העבודה השמורות.';
            renderProjectWorkflow();
        }).getProjectWorkflow(p.folderId, p.no, p.name);
    }
    function saveProjectWorkflowFromHome() {
        var p = state.selectedProject;
        if (!p || !projectWorkflowDraft.writable || projectWorkflowDraft.loading || workflowSaving) return;
        var payloadTasks = [];
        Object.keys(workflowTaskDefinitions).forEach(function(stage) {
            workflowTaskDefinitions[stage].forEach(function(def) {
                var task = workflowTaskDrafts[stage] && workflowTaskDrafts[stage][def[0]];
                payloadTasks.push({ id: def[0], status: (task && task.status) || 'NOT_STARTED', note: (task && task.note) || '' });
            });
        });
        var payload = { revision: projectWorkflowDraft.revision, stage: projectWorkflowDraft.stage, tasks: payloadTasks };
        if (payload.tasks.some(function(task) { return task.status === 'DONE' && !task.note.trim(); })) {
            workflowMessage = 'כדי לסמן משימה כהושלמה, הוסיפו הערה או הפניה לראיית המקור.'; renderProjectWorkflow();
            return;
        }
        workflowSaving = true; renderProjectWorkflow();
        google.script.run.withSuccessHandler(function(res) {
            if (!state.selectedProject || String(state.selectedProject.no) !== String(p.no)) return;
            workflowSaving = false;
            if (res && res.success) {
                projectWorkflowDraft.revision = res.revision == null ? projectWorkflowDraft.revision : res.revision;
                projectWorkflowDraft.tasks = Array.isArray(res.tasks) ? res.tasks : payload.tasks;
                workflowTaskDrafts = Object.create(null);
                projectWorkflowDraft.tasks.forEach(function(task) { var stage = task.stage || projectWorkflowDraft.stage; if (!workflowTaskDrafts[stage]) workflowTaskDrafts[stage] = Object.create(null); workflowTaskDrafts[stage][task.id] = task; });
                workflowDirty = false;
                workflowSavedStage = projectWorkflowDraft.stage; workflowStageDirty = false;
                workflowMessage = 'החלטות העבודה נשמרו עם משתמש ותאריך.';
            } else {
                workflowMessage = (res && (res.error || res.message)) || 'השמירה נדחתה. טענו מחדש את תמונת העבודה לפני ניסיון נוסף.';
            }
            renderProjectWorkflow();
            renderProjectHome();
        }).withFailureHandler(function(err) {
            if (!state.selectedProject || String(state.selectedProject.no) !== String(p.no)) return;
            workflowSaving = false;
            workflowMessage = 'השמירה נכשלה: ' + (err && err.message ? err.message : 'לא ניתן לשמור כרגע.');
            renderProjectWorkflow();
            renderProjectHome();
        }).saveProjectWorkflow(p.folderId, p.no, p.name, payload);
    }
    function setPilotMatchCell(cell, row, available, message) {
        cell.innerHTML = '';
        if (cell.getAttribute('data-acc-model-edited') === 'true') {
            cell.textContent = 'נערך בטיוטה הנוכחית; השינוי אינו כלול בצילום המקור האחרון. נדרש סנכרון מחדש.';
            cell.className = 'py-2 px-3 text-xs min-w-52 text-amber-700';
            return;
        }
        if (!available) { cell.textContent = message || 'צילום הענן אינו זמין לפרויקט זה.'; return; }
        if (!row) { cell.textContent = 'אין התאמה לקוד המתוכנן בצילום הזמין; נדרש אימות שיוך והיקף סריקה.'; return; }
        var state = document.createElement('span');
        state.className = 'text-xs font-semibold ' + (row.status === 'NOT_FOUND_IN_SCOPE' ? 'text-amber-700' : 'text-slate-700');

    function ensurePilotCloudSnapshot() {
        var projectNo = state.selectedProject && state.selectedProject.no;
        if (!projectNo) return;
        var key = String(projectNo);
        if (pilotSnapshotCache[key]) { applyPilotSnapshotToModelTable(projectNo); return; }
        if (pilotSnapshotPending[key]) return;
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
            document.querySelectorAll('[data-acc-model-code]').forEach(function(cell) { setPilotMatchCell(cell, null, false, 'שירות צילום הענן אינו זמין.'); });
            return;
        }
        document.querySelectorAll('[data-acc-model-code]').forEach(function(cell) { cell.textContent = 'טוען סריקת ענן…'; });
        pilotSnapshotPending[key] = true;
        var requestGeneration = cloudConnectionGeneration;
        google.script.run.withSuccessHandler(function(result) {
            delete pilotSnapshotPending[key];
            if (requestGeneration !== cloudConnectionGeneration) return;
            pilotSnapshotCache[key] = result || { available: false, message: 'צילום הענן אינו זמין.' };
            if (state.selectedProject && String(state.selectedProject.no) === key) applyPilotSnapshotToModelTable(projectNo);
        }).withFailureHandler(function() {
            delete pilotSnapshotPending[key];
            if (requestGeneration !== cloudConnectionGeneration) return;
            if (state.selectedProject && String(state.selectedProject.no) === key) {
                document.querySelectorAll('[data-acc-model-code]').forEach(function(cell) { setPilotMatchCell(cell, null, false, 'לא ניתן לטעון את צילום הענן.'); });
            }
        }).getPilotCloudSnapshot(projectNo);
    }

    function updateDbStatusText(msg) { const el = document.getElementById("db-last-sync-text"); if(el) el.innerText = msg; }
    function openSheetOnly() { if (state.sheetUrl) { window.open(state.sheetUrl, '_blank'); } else { showToast("הקישור עדיין לא מוכן, אנא המתן או לחץ על סנכרון.", "error"); } }
</script>
