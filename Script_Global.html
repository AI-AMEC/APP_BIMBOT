<script>
    // ==========================================
    // 1. GLOBAL STATE
    // ==========================================
    let state = {
        projects: [], 
        allProjects: [], 
        selectedProject: null,
        isAuthenticated: false,
        currentUserEmail: "",
        bimInfo: { code: "", revit: "", cdePlatform: "", docManagement: "", bimPlatform: "", driveFolder: "", acc: "", docLink: "", hub: "" },
        kickoff: { arcModel: '', grids: '', arLevel: '', urs: '', glLevel: '0.00', liveShared: '', licensing: '' },
        liveLink: '', 
        sharedLink: '', 
        edmsPlatforms: [],
        mdcCurrentStep: 1, 
        mdcLots: [], 
        mdcBuildings: [], 
        mdcBasements: [], 
        mdcGenModels: [],
        mdcDisciplines: [], 
        matrix: {},
        notebook: [],
        processData: [], 
        uniqueProcesses: [], 
        selectedProcessName: "", 
        bdgFiles: [], 
        filteredBdgFiles: [],
        contacts: [], 
        editingContactIndex: null, 
        sheetUrl: "",
        hasDbAccess: false,
        canViewAllProjects: false,
        allAvailableDisciplines: [],
        currentPage: 1,
        itemsPerPage: 50,
        filteredProjectsArray: []
    };

    let autoSaveTimer = null; 

    // ==========================================
    // 2. UTILITIES & UI HELPERS
    // ==========================================
    function safeGetLocal(key) { 
        try { 
            return JSON.parse(localStorage.getItem(key) || '{}'); 
        } catch(e) { 
            return {}; 
        } 
    }

    function safeSetLocal(key, value) { 
        try { 
            localStorage.setItem(key, value); 
        } catch(e) { } 
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        
        let bgColor = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-red-600' : 'bg-slate-800');
        toast.className = bgColor + ' text-white px-5 py-3 rounded-lg shadow-lg text-sm font-semibold transition-all duration-300 opacity-0 translate-y-4 transform pointer-events-auto';
        toast.textContent = message;
        
        container.appendChild(toast);
        
        setTimeout(() => toast.classList.remove("opacity-0", "translate-y-4"), 10);
        setTimeout(() => { 
            toast.classList.add("opacity-0", "translate-y-4"); 
            setTimeout(() => toast.remove(), 300); 
        }, 3500);
    }

    function setRadioValue(name, val) { 
        const radios = document.getElementsByName(name); 
        for(let i = 0; i < radios.length; i++) { 
            if(radios[i].value === val) { 
                radios[i].checked = true; break; 
            } else { 
                radios[i].checked = false; 
            } 
        } 
    }

    function getRadioValue(name) { 
        const checked = document.querySelector('input[name="' + name + '"]:checked'); 
        return checked ? checked.value : ""; 
    }

    function applyPermissionsUI() {
        const settingsBtn = document.getElementById("nav-btn-settings"); 
        if (settingsBtn) { 
            if (state.hasDbAccess && state.canViewAllProjects) settingsBtn.classList.remove("hidden"); 
            else settingsBtn.classList.add("hidden"); 
        }

        const dbBtn = document.getElementById("tab-btn-db"); 
        if (dbBtn) { 
            if (state.hasDbAccess) dbBtn.classList.remove("hidden"); 
            else dbBtn.classList.add("hidden"); 
        }

        const contactsNextBtn = document.getElementById("btn-contacts-next-db");
        if (contactsNextBtn) {
            if (state.hasDbAccess) contactsNextBtn.classList.remove("hidden");
            else contactsNextBtn.classList.add("hidden");
        }
    }

    // ==========================================
    // 3. GLOBAL EVENT LISTENERS
    // ==========================================
    document.addEventListener('click', function(event) {
        if (!event.target.closest('.multi-select-container')) { 
            document.querySelectorAll('.multi-select-dropdown').forEach(d => d.classList.add('hidden')); 
        }
        if (!event.target.closest('#bdg-project-select-container')) { 
            const dropdown = document.getElementById('bdg-project-dropdown-list'); 
            if(dropdown && !dropdown.classList.contains('hidden')) { 
                dropdown.classList.add('hidden'); 
            } 
        }
    });

    // ==========================================
    // 4. AUTHENTICATION & DATA INIT
    // ==========================================
    function authenticateUser() {
        try {
            const btn = document.getElementById("btn-login");
            if (!btn || btn.disabled) return; 

            const originalHTML = btn.innerHTML;
            btn.innerHTML = 'מתחבר...'; 
            btn.disabled = true;

            const listEl = document.getElementById("dashboard-project-list");
            if (listEl) {
                listEl.innerHTML = '<tr><td colspan="10" class="p-12 text-center text-slate-400 font-medium">מאמת משתמש...</td></tr>';
            }

            google.script.run
                .withSuccessHandler(function(res) {
                    try {
                        if (res && res.success) {
                            const authSection = document.getElementById("auth-section");
                            if (authSection) {
                                let initials = res.email ? res.email.substring(0,2).toUpperCase() : "US";
                                authSection.innerHTML = '<div class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-sm border border-blue-200">' + initials + '</div><span class="text-xs font-mono font-semibold text-slate-500">' + res.email + '</span>';
                            }
                            
                            state.isAuthenticated = true; 
                            state.currentUserEmail = res.email;
                            showToast("התחברת בהצלחה בתור " + res.email, "success");
                            
                            state.hasDbAccess = res.canViewDatabase === true; 
                            state.canViewAllProjects = res.canViewAllProjects === true;

                            applyPermissionsUI();

                            if (listEl) {
                                listEl.innerHTML = '<tr><td colspan="10" class="p-12 text-center text-slate-400 font-medium">טוען את הפרויקטים שלך...</td></tr>';
                            }
                            loadInitialData(); 
                            
                        } else {
                            btn.innerHTML = originalHTML; 
                            btn.disabled = false; 
                            let errorMsg = res ? res.error : "שגיאת מערכת לא מוכרת"; 
                            showToast("האימות נכשל: " + errorMsg, "error");
                            if (listEl) {
                                listEl.innerHTML = '<tr><td colspan="10" class="p-16 text-center text-red-500 font-bold bg-red-50 rounded-xl">האימות נכשל: ' + errorMsg + '</td></tr>';
                            }
                        }
                    } catch(e) { 
                        btn.innerHTML = originalHTML; 
                        btn.disabled = false; 
                        showToast("שגיאת ממשק לאחר האימות: " + e.message, "error"); 
                    }
                })
                .withFailureHandler(function(err) {
                    btn.innerHTML = originalHTML; 
                    btn.disabled = false; 
                    showToast("שגיאה בחיבור לשרת: " + err.message, "error");
                    if (listEl) {
                        listEl.innerHTML = '<tr><td colspan="10" class="p-16 text-center text-red-500 font-bold bg-red-50 rounded-xl">שגיאת שרת: ' + err.message + '</td></tr>';
                    }
                }).getActiveUserInfo();
        } catch(ex) { 
            showToast("קריסה: " + ex.message, "error"); 
        }
    }

    function loadInitialData() {
        const listEl = document.getElementById("dashboard-project-list");

        google.script.run
            .withSuccessHandler(res => {
                if(res && res.success) {
                    state.projects = res.data; 
                    state.allProjects = res.allProjects || res.data; 
                    state.canViewAllProjects = res.canViewAllProjects === true;
                    state.hasDbAccess = res.canViewDatabase === true;
                    state.sourceWarnings = Array.isArray(res.sourceWarnings) ? res.sourceWarnings : [];
                    safeSetLocal('bim_source_warnings', JSON.stringify(state.sourceWarnings));
                    if (typeof renderSourceWarnings === 'function') renderSourceWarnings(state.sourceWarnings);

                    applyPermissionsUI();
                    populateDropdowns(state.projects); 
                    filterProjects(); 
                    updateDashboardStats(); 
                    showView('dashboard');
                } else {
                    if (listEl) listEl.innerHTML = '<tr><td colspan="10" class="p-16 text-center text-red-500 font-bold bg-red-50 rounded-xl">' + (res ? res.error : "שגיאה בטעינת הפרויקטים") + '</td></tr>';
                    showToast(res ? res.error : "Error", "error");
                }
            })
            .withFailureHandler(err => {
                if (listEl) listEl.innerHTML = '<tr><td colspan="10" class="p-16 text-center text-red-500 font-bold bg-red-50 rounded-xl">החיבור לשרת נכשל: ' + err.message + '</td></tr>';
                showToast("שגיאת שרת: " + err.message, "error");
            }).getCachedProjectData();

        google.script.run.withSuccessHandler(res => {
            if(res && res.success) {
                const pLoad = document.getElementById("process-list-loading"); 
                if (pLoad) pLoad.classList.add("hidden"); 
                state.processData = res.data; 
                state.uniqueProcesses = [...new Set(res.data.map(p => p.process))]; 
                renderProcessMenu();
            }
        }).getProcessTableData();

        google.script.run.withSuccessHandler(res => {
            if(res && res.success) populateDynamicDropdowns(res.data);
        }).getDropdownData();
    }

    function populateDynamicDropdowns(data) {
        try {
            state.liveLink = data.liveLink || "";
            state.sharedLink = data.sharedLink || "";
            state.edmsPlatforms = data.edmsPlatforms || [];

            const fillOptions = (id, optionsArray, placeholder) => {
                const el = document.getElementById(id);
                if(el && optionsArray) {
                    let html = '<option value="">' + placeholder + '</option>';
                    optionsArray.forEach(item => { 
                        html += '<option value="' + item + '">' + item + '</option>'; 
                    });
                    el.innerHTML = html;
                }
            };
            
            if(!data) return;

            fillOptions("info-revit-ver", data.revitVersions, "בחר גרסה...");
            fillOptions("info-cde-platform", data.cdePlatforms, "בחר פלטפורמה...");
            fillOptions("info-bim-platform", data.bimPlatforms, "בחר פלטפורמה...");

            const docEl = document.getElementById("info-doc-management");
            if(docEl && state.edmsPlatforms) {
                let html = '<option value="">בחר פלטפורמה...</option>';
                state.edmsPlatforms.forEach(item => { 
                    html += '<option value="' + item.name + '">' + item.name + '</option>'; 
                });
                html += '<option value="CUSTOM">הוסף ידנית...</option>';
                docEl.innerHTML = html;
            }

            if(data.allDisciplines) {
                state.allAvailableDisciplines = data.allDisciplines;
                if(state.selectedProject && state.mdcDisciplines.length === 0) {
                    state.mdcDisciplines = state.allAvailableDisciplines
                        .filter(d => d.isDefault === true)
                        .map(d => ({ he: d.he, ac: d.ac, isDefault: true, checked: true }));
                    renderDisciplines();
                }
            }
        } catch(e) { 
            console.log("Error populating dropdowns", e);
        }
    }

    // ==========================================
    // 5. NAVIGATION LOGIC
    // ==========================================
    function showView(viewName) {
        if (viewName === 'settings' && !(state.hasDbAccess && state.canViewAllProjects)) {
            showToast("הגישה נדחתה: נדרשת הרשאת מנהל מלאה למרכז הזהויות.", "error");
            return;
        }

        document.getElementById("view-dashboard").classList.add("hidden"); 
        document.getElementById("view-project-details").classList.add("hidden");
        document.getElementById("view-settings").classList.add("hidden"); 
        document.getElementById("view-documents").classList.add("hidden");

        const btnProjects = document.getElementById("nav-btn-projects"); 
        const btnDocs = document.getElementById("nav-btn-documents"); 
        const btnSettings = document.getElementById("nav-btn-settings");
        
        let baseClass = "w-full flex items-center space-x-3 text-slate-500 hover:text-slate-800 hover:bg-slate-50 px-3 py-2 rounded-lg font-medium text-sm transition";
        let activeClass = "w-full flex items-center space-x-3 bg-blue-50 text-blue-700 px-3 py-2 rounded-lg font-semibold text-sm transition";

        if(btnProjects) btnProjects.className = baseClass; 
        if(btnDocs) btnDocs.className = baseClass; 
        if(btnSettings) btnSettings.className = baseClass;

        if (viewName === 'dashboard' || viewName === 'project-details') { 
            if(btnProjects) btnProjects.className = activeClass;
        } else if (viewName === 'documents') {
            if(btnDocs) btnDocs.className = activeClass; 
            document.getElementById("docs-content").classList.remove("hidden"); 
            populateBdgProjectDropdown();
            if (state.processData.length > 0 && !state.selectedProcessName) renderProcessMenu();
        } else if (viewName === 'settings') {
            if(btnSettings) btnSettings.className = activeClass; 
            renderIdHubProjects(); 
        }

        const viewEl = document.getElementById("view-" + viewName); 
        if(viewEl) viewEl.classList.remove("hidden");
        
        if (viewName === 'dashboard') filterProjects();
    }
</script>
