<style>
  body { font-family: 'Inter', sans-serif; direction: ltr; background-color: #f8fafc; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  /* Table column titles are centered above their column everywhere in the app */
  table thead th { text-align: center !important; vertical-align: middle; }
  /* Radio Button Custom Styling */
  input[type="radio"]:checked + div {
      background-color: #2563eb;
      color: white;
      border-color: #2563eb;
  }
</style>
