<div id="view-dashboard" lang="he" dir="rtl" class="pilot-dashboard max-w-[1600px] mx-auto p-4 md:p-6 space-y-4 block">
    <div class="pilot-dashboard-heading flex flex-wrap justify-between items-end gap-4 border-b border-slate-200 pb-4">
        <div>
            <p class="pilot-eyebrow">AMEC · BIMBOT</p>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">פרויקטים</h2>
            <p class="text-sm text-slate-500 mt-1 flex items-center gap-2">
                <span class="text-emerald-500 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> המערכת מוכנה</span>
                <span class="text-slate-300">·</span><span>תמונת מצב של תיק הפרויקטים</span>
            </p>
        </div>
    </div>

    <div id="source-warnings" class="hidden rounded-lg border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900" role="status" aria-live="polite"></div>

    <div class="pilot-stats grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="pilot-stat"><span class="pilot-stat-label">סך הפרויקטים</span><span class="text-slate-900 font-bold" id="stat-total">0</span></div>
        <div class="pilot-stat"><span class="pilot-stat-label">פעילים</span><span class="text-emerald-700 font-bold" id="stat-active">0</span></div>
        <div class="pilot-stat"><span class="pilot-stat-label">בהמתנה</span><span class="text-amber-700 font-bold" id="stat-hold">0</span></div>
    </div>

    <div class="flex flex-wrap justify-between items-center gap-4 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
        <div class="flex flex-wrap items-center gap-3">
            <select id="filter-manager" class="text-sm border border-slate-200 rounded-lg py-2 px-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none transition text-slate-700" onchange="filterProjects()"><option value="All">כל מנהלי BIM</option></select>
            <select id="filter-status" class="text-sm border border-slate-200 rounded-lg py-2 px-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none transition text-slate-700" onchange="filterProjects()"><option value="All">כל הסטטוסים</option></select>
            <select id="filter-coordinator" class="text-sm border border-slate-200 rounded-lg py-2 px-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none transition text-slate-700" onchange="filterProjects()"><option value="All">כל המתאמים</option></select>
            <select id="filter-leader" class="text-sm border border-slate-200 rounded-lg py-2 px-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none transition text-slate-700" onchange="filterProjects()"><option value="All">כל מובילי BIM</option></select>
            <select id="filter-department" class="text-sm border border-slate-200 rounded-lg py-2 px-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none transition text-slate-700" onchange="filterProjects()"><option value="All">כל המחלקות</option></select>
            <div class="relative w-64">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="project-search" placeholder="חיפוש פרויקטים..." class="pl-9 w-full text-sm border border-slate-200 rounded-lg py-2 focus:ring-2 focus:ring-blue-500 outline-none transition bg-slate-50" onkeyup="filterProjects()">
            </div>
        </div>
        <div>
            <!-- Added type="button" to prevent reloading, and updated classes to match the blue buttons -->
            <button type="button" onclick="refreshDatabase()" id="btn-sync-data" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg shadow-sm transition text-sm">
                <svg id="icon-sync" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>סנכרון נתונים</span>
            </button>
        </div>
    </div>

    <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200 shadow-sm mt-2">
        <div class="flex items-center gap-2 text-sm text-slate-600 font-medium">
            <span>הצגת</span>
            <select id="items-per-page" class="border border-slate-200 bg-slate-50 rounded p-1 outline-none focus:ring-2 focus:ring-blue-500" onchange="changeItemsPerPage()">
                <option value="25">25</option>
                <option value="50" selected>50</option>
                <option value="75">75</option>
                <option value="100">100</option>
            </select>
            <span>פרויקטים בעמוד</span>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="prevPage()" id="btn-prev-page" class="flex items-center justify-center p-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 hover:text-blue-600 disabled:opacity-50 disabled:cursor-not-allowed transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <span id="page-info" class="text-sm font-bold text-slate-700">עמוד 1 מתוך 1</span>
            <button onclick="nextPage()" id="btn-next-page" class="flex items-center justify-center p-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 hover:text-blue-600 disabled:opacity-50 disabled:cursor-not-allowed transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden mt-4">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="bg-slate-50 text-slate-500 uppercase text-xs font-bold tracking-wider border-b border-slate-200">
                        <th class="py-3 px-3">פרויקט</th>
                        <th class="py-3 px-3">קוד</th>
                        <th class="py-3 px-3">סטטוס</th>
                        <th class="py-3 px-3">מנהל BIM</th>
                        <th class="py-3 px-3">עומס BIM</th>
                        <th class="py-3 px-3">מתאם</th>
                        <th class="py-3 px-3 text-emerald-600">עומס מערכות</th>
                        <th class="py-3 px-3 text-blue-600">מוביל BIM</th>
                        <th class="py-3 px-3">מחלקה</th>
                        <th class="py-3 px-3">סנכרון אחרון</th>
                    </tr>
                </thead>
                <tbody id="dashboard-project-list" class="divide-y divide-slate-100">
                    <tr><td colspan="10" class="p-12 text-center">
                        <div class="flex flex-col items-center justify-center space-y-3">
                            <svg class="w-10 h-10 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            <span class="text-slate-400 font-medium">יש להתחבר באמצעות Google כדי לטעון פרויקטים...</span>
                        </div>
                    </td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
