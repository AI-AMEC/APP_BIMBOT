  window.loadModelGovernance=function(force){var p=state.selectedProject;if(!p){governanceState.error='יש לבחור פרויקט כדי לטעון מודלים.';render();return;}var key=projectKey(p),seq=++governanceSeq;if(governanceState.projectKey&&governanceState.projectKey!==key){governanceState.editing=null;governanceState.pendingDraft=null;governanceState.reloadNotice='';governanceState.focusId=null;governanceState.query='';governanceState.filter='all';governanceState.discipline='';}governanceState.projectKey=key;governanceState.snapshot=null;governanceState.records={};governanceState.error='טוען מודלים והחלטות…';governanceState.writable=false;render();google.script.run.withSuccessHandler(function(pub){if(!current(seq,key))return;if(!pub||pub.available!==true||!pub.snapshot){governanceState.error='צילום מודלי הענן אינו זמין לפרויקט זה.';render();return;}governanceState.snapshot=pub.snapshot;google.script.run.withSuccessHandler(function(g){if(!current(seq,key))return;governanceState.records=recordMap(g);governanceState.writable=!!(g&&g.success&&g.writable===true);governanceState.error=g&&g.success?'':txt(g&&g.error)||'לא ניתן לטעון את החלטות השיוך.';governanceCache[key]={snapshot:governanceState.snapshot,records:governanceState.records};if(governanceState.pendingDraft){var pendingId=governanceState.pendingDraft.id;if(governanceState.records[pendingId])governanceState.pendingDraft.data.revision=Number(governanceState.records[pendingId].revision)||0;}if(governanceState.focusId){governanceState.editing=governanceState.focusId;governanceState.query='';governanceState.filter='all';governanceState.discipline='';}render();if(governanceState.focusId){var focus=governanceState.focusId;governanceState.focusId=null;var names=Array.prototype.slice.call(document.querySelectorAll('#model-governance-root .mg-name'));var idx=modelList().filter(matches).findIndex(function(m){return String(m.id)===String(focus);});if(names[idx])names[idx].scrollIntoView({block:'center'});}window.applyModelGovernanceTo   window.applyModelGovernanceToRegister=function(projectNo){var p=state.selectedProject;if(!p||String(p.no)!==String(projectNo))return;var cache=governanceCache[projectKey(p)];if(!cache)return;var grouped=Object.create(null);Object.keys(cache.records||{}).forEach(function(id){var r=cache.records[id]||{};if(r.classified!==true||!r.registerCode)return;var key=String(r.registerCode);if(!grouped[key])grouped[key]=[];var model=(cache.snapshot.models||[]).filter(function(m){return String(m.id)===String(id);})[0];if(model)grouped[key].push({name:txt(model.name)||String(id),excluded:isExcluded(r)});});document.querySelectorAll('[data-acc-model-code]').forEach(function(cell){if(cell.getAttribute('data-mg-applied-text')!=null){if(cell.textContent===cell.getAttribute('data-mg-applied-text'))cell.textContent=cell.getAttribute('data-mg-original-text')||'';else cell.setAttribute('data-mg-original-text',cell.textContent);}else cell.setAttribute('data-mg-original-text',cell.textContent);cell.removeAttribute('data-mg-applied-text');var code;try{code=decodeURIComponent(cell.getAttribute('data-acc-model-code')||'');}catch(e){return;}var links=grouped[code];if(!links||!links.length)return;var active=links.filter(function(x){return !x.excluded;}),excluded=links.filter(function(x){return x.excluded;});var lines=[];if(active.length)lines.push(active.map(function(x){return x.name;}).join(' · ')+' · שיוך מאושר');if(excluded.length)lines.push(excluded.map(function(x){return x.name;}).join(' · ')+' · לא נכלל בבקרה');cell.textContent=lines.join(' | ');cell.setAttribute('data-mg-applied-text',cell.textContent);cell.setAttribute('title','שיוך שנקבע בהחלטה שמורה לפרויקט.');});};
  window.openModelGovernance=function(modelId){governanceState.focusId=modelId==null?null:String(modelId);if(typeof switchTab==='function'){state.mdcCurrentStep=4;switchTab('mdc');}else if(typeof setMdcStep==='function')setMdcStep(4);};
})();
