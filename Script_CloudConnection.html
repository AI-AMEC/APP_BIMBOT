<script>
(function(){
  var cc={hubs:[],projects:[],hubId:'',status:null,pollTimer:null,pollCount:0,loadSeq:0};
  function el(id){return document.getElementById(id);}
  function msg(text,error){var n=el('cc-message');if(n){n.textContent=text||'';n.className='mt-1 text-xs '+(error?'text-rose-600':'text-slate-500');}}
  function bindMsg(text,error){var n=el('cc-binding-message');if(n){n.textContent=text||'';n.className='mt-2 text-xs '+(error?'text-rose-600':'text-slate-500');}}
  function run(name,args,ok,fail,timeout){var done=false,t=setTimeout(function(){if(done)return;done=true;fail(new Error('הבקשה נמשכה זמן רב מדי. אפשר לנסות שוב.'));},timeout||30000);try{var r=google.script.run.withSuccessHandler(function(v){if(done)return;done=true;clearTimeout(t);ok(v);}).withFailureHandler(function(e){if(done)return;done=true;clearTimeout(t);fail(e||new Error('הפעולה נכשלה.'));});if(typeof r[name]!=='function')throw new Error('הפעולה אינה זמינה בגרסה הנוכחית.');r[name].apply(r,args||[]);}catch(e){if(!done){done=true;clearTimeout(t);fail(e);}}}
  function setBusy(id,busy,label){var b=el(id);if(!b)return;b.disabled=!!busy;if(label)b.textContent=label;}
  function renderStatus(s){cc.status=s||null;var dot=el('cc-status-dot'),status=el('cc-status'),connect=el('cc-connect'),disconnect=el('cc-disconnect');if(!dot||!status)return;
    dot.className='h-2.5 w-2.5 rounded-full '+(s&&s.connected?'bg-emerald-500':s&&s.configured?'bg-amber-400':'bg-slate-300');
    status.textContent=!s?'מצב החיבור טרם נבדק':s.connected?'מחובר ל-'+(s.autodeskName||'Autodesk')+(s.autodeskUserId?' · '+s.autodeskUserId:'')+(s.email?' · Google: '+s.email:''):s.configured?'לא מחובר':'החיבור טרם הוגדר על ידי מנהל המערכת';
    if(connect)connect.classList.toggle('hidden',!!(s&&s.connected));if(disconnect)disconnect.classList.toggle('hidden',!(s&&s.connected));
  }
  function invalidateCloudUi(){
    // Notify the cloud view modules without coupling this strip to their private caches.
    window.dispatchEvent(new CustomEvent('bimbot:cloud-connection-changed',{detail:{connected:!!(cc.status&&cc.status.connected)}}));
  }
  window.ccRefreshStatus=function(){msg('בודק את מצב החיבור…');setBusy('cc-refresh',true,'בודק…');run('getAutodeskConnectionStatus',[],function(r){setBusy('cc-refresh',false,'רענון מצב');if(!r||!r.success){var hadIdentity=!!(cc.status&&cc.status.connected);cc.status=null;renderStatus(null);if(hadIdentity)invalidateCloudUi();msg((r&&r.error)||'לא ניתן לבדוק את החיבור. נסה שוב.',true);return;}var changed=!cc.status||cc.status.connected!==r.connected||cc.status.epoch!==r.epoch||cc.status.autodeskUserId!==r.autodeskUserId;renderStatus(r);msg(r.connected?'החשבון האישי מחובר וניתן לבחור פרויקט ACC.':r.configured?'התחבר כדי לגשת לפרויקטים בחשבון Autodesk שלך.':'יש לפנות למנהל המערכת להגדרת אפליקציית Autodesk.');if(changed)invalidateCloudUi();},function(e){setBusy('cc-refresh',false,'רענון מצב');var hadIdentity=!!(cc.status&&cc.status.connected);cc.status=null;renderStatus(null);if(hadIdentity)invalidateCloudUi();msg('בדיקת החיבור נכשלה: '+(e.message||e),true);},20000);};
  function stopPolling(){if(cc.pollTimer){clearTimeout(cc.pollTimer);cc.pollTimer=null;}}
  function startPolling(baseline){stopPolling();cc.pollCount=0;function check(){if(cc.pollCount>=45){stopPolling();msg('לא זוהה עדיין חיבור חדש. אם השלמת את האישור בחלון Autodesk, לחץ על „רענון מצב”.',true);return;}cc.pollCount++;run('getAutodeskConnectionStatus',[],function(r){var freshConnection=r&&r.success&&r.connected&&(baseline.wasConnected!==true||r.epoch!==baseline.epoch||r.autodeskUserId!==baseline.autodeskUserId);if(freshConnection){stopPolling();renderStatus(r);msg('החיבור ל-Autodesk הושלם.');invalidateCloudUi();return;}if(cc.pollCount>=45){stopPolling();msg('לא זוהה חיבור חדש. אם השלמת את האישור בחלון Autodesk, לחץ על „רענון מצב”.',true);return;}cc.pollTimer=setTimeout(check,2000);},function(){if(cc.pollCount>=45){stopPolling();msg('לא ניתן לאמת את החיבור כרגע. לחץ על „רענון מצב” כדי לנסות שוב.',true);return;}cc.pollTimer=setTimeout(check,2000);},15000);}check();}
  window.ccConnect=function(){var baseline={wasConnected:!!(cc.status&&cc.status.connected),epoch:cc.status&&cc.status.epoch,autodeskUserId:cc.status&&cc.status.autodeskUserId};var popup=null;try{popup=window.open('about:blank','bimbotAutodeskOAuth','popup,width=620,height=760');}catch(e){}invalidateCloudUi();msg('פותח חלון התחברות מאובטח…');setBusy('cc-connect',true,'פותח…');run('getAutodeskAuthorizationUrl',[],function(url){setBusy('cc-connect',false,'התחברות ל-Autodesk');if(typeof url!=='string'||!/^https:\/\//i.test(url)){if(popup)popup.close();msg('לא התקבל קישור התחברות תקין. פנה למנהל המערכת.',true);return;}if(popup){try{popup.location.href=url;popup.focus();}catch(e){window.open(url,'_blank');}}else{window.open(url,'_blank');}msg('אשר גישה ל-BIMBOT בחלון Autodesk. נבדוק את מצב החיבור החדש לזמן מוגבל.');startPolling(baseline);},function(e){setBusy('cc-connect',false,'התחברות ל-Autodesk');if(popup)popup.close();msg((e.message||e)+'',true);},20000);};
  window.ccDisconnect=function(){setBusy('cc-disconnect',true,'מנתק…');run('disconnectAutodesk',[],function(r){setBusy('cc-disconnect',false,'ניתוק');if(!r||!r.success){msg((r&&r.error)||'הניתוק נכשל.',true);return;}renderStatus({success:true,configured:cc.status&&cc.status.configured,connected:false});msg('החשבון האישי נותק.');invalidateCloudUi();},function(e){setBusy('cc-disconnect',false,'ניתוק');msg('הניתוק נכשל: '+(e.message||e),true);},20000);};
  window.ccToggleBinding=function(){var box=el('cc-binding');if(!box)return;box.classList.toggle('hidden');if(!box.classList.contains('hidden')&&!cc.hubs.length)ccLoadHubs(false);};
  window.ccRefreshHubs=function(){cc.hubs=[];cc.projects=[];ccLoadHubs(true);};
  window.ccLoadHubs=function(refresh){var select=el('cc-hub'),project=el('cc-project');if(!select)return;select.innerHTML='<option value="">טוען HUBs…</option>';if(project)project.innerHTML='<option value="">ממתין לטעינת HUBs</option>';bindMsg('טוען HUBs זמינים…');run('apsListHubs',[refresh===true],function(r){if(!r||!r.success){select.innerHTML='<option value="">לא ניתן לטעון HUBs</option>';bindMsg((r&&r.error)||'טעינת HUBs נכשלה.',true);return;}cc.hubs=r.hubs||[];if(!cc.hubs.length){select.innerHTML='<option value="">לא נמצאו HUBs</option>';bindMsg('אין HUBs זמינים בחשבון. בדוק הרשאות או פנה למנהל המערכת.',true);return;}select.innerHTML='<option value="">בחר HUB</option>'+cc.hubs.map(function(h){return '<option value="'+String(h.id).replace(/[&"<>']/g,'')+'">'+String(h.name||'HUB').replace(/[&<>]/g,'')+'</option>';}).join('');bindMsg('בחר HUB כדי לטעון את הפרויקטים.');},function(e){select.innerHTML='<option value="">טעינת HUBs נכשלה</option>';bindMsg('טעינת HUBs נכשלה: '+(e.message||e),true);},90000);};
  window.ccLoadProjects=function(refresh){var hub=el('cc-hub'),select=el('cc-project');if(!hub||!select||!hub.value)return;var id=hub.value,seq=++cc.loadSeq;cc.hubId=id;select.innerHTML='<option value="">טוען פרויקטים…</option>';bindMsg('טוען פרויקטים מה-HUB שנבחר…');run('apsListProjects',[id,refresh===true],function(r){if(seq!==cc.loadSeq||id!==hub.value)return;if(!r||!r.success){select.innerHTML='<option value="">לא ניתן לטעון פרויקטים</option>';bindMsg((r&&r.error)||'טעינת הפרויקטים נכשלה.',true);return;}cc.projects=r.projects||[];select.innerHTML='<option value="">בחר פרויקט ACC</option>'+cc.projects.map(function(p){return '<option value="'+String(p.id).replace(/[&"<>']/g,'')+'">'+String(p.name||p.id).replace(/[&<>]/g,'')+' · '+String(p.type||'ACC').replace(/[&<>]/g,'')+'</option>';}).join('');bindMsg(cc.projects.length?'בחר את הפרויקט המתאים במפורש. הבחירה לא נשמרת עד לחיצה על כפתור החיבור.':'אין פרויקטים זמינים ב-HUB זה.',!cc.projects.length);},function(e){if(seq!==cc.loadSeq)return;select.innerHTML='<option value="">טעינת פרויקטים נכשלה</option>';bindMsg('טעינת הפרויקטים נכשלה: '+(e.message||e),true);},90000);};
  window.ccSaveBinding=function(){var p=el('cc-project'),h=el('cc-hub'),selected=cc.projects.filter(function(x){return x.id===p.value;})[0],projectNo=typeof state!=='undefined'&&state.selectedProject&&String(state.selectedProject.no);if(!projectNo){bindMsg('בחר פרויקט BIMBOT תחילה.',true);return;}if(!cc.status||!cc.status.connected){bindMsg('יש להתחבר לחשבון Autodesk לפני שיוך פרויקט.',true);return;}if(!h.value||!selected){bindMsg('בחר HUB ופרויקט ACC מהרשימה.',true);return;}setBusy('cc-bind',true,'שומר שיוך…');bindMsg('שומר את השיוך האישי…');run('setLiveAccProject',[projectNo,h.value,selected.id],function(r){setBusy('cc-bind',false,'חיבור הפרויקט הנבחר');if(!r||r.success!==true){bindMsg((r&&r.error)||'שמירת השיוך נכשלה.',true);return;}bindMsg('הפרויקט שויך לחשבון Autodesk האישי שלך.');invalidateCloudUi();if(typeof window.onLiveAccProjectBound==='function')window.onLiveAccProjectBound(projectNo,r);},function(e){setBusy('cc-bind',false,'חיבור הפרויקט הנבחר');bindMsg('שמירת השיוך נכשלה: '+(e.message||e),true);},30000);};
})();
</script>
