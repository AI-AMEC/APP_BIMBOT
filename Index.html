  <!-- ROBUST GOOGLE CONNECT SESSION MEMORY SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
        const loginBtn = document.getElementById("btn-login");

        if (loginBtn) {
            // 1. Check if user already clicked login in this session
            if (sessionStorage.getItem("bimbot_user_logged_in") === "true") {
                
                // Immediately show "מתחבר..." visual state
                loginBtn.innerHTML = '<svg class="animate-spin w-5 h-5 mr-3 text-blue-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span class="text-blue-600">מתחבר...</span>';
                loginBtn.style.pointerEvents = "none";
                loginBtn.classList.add("opacity-75");

                // Check every 250ms if Google is fully awake, then native-execute the login function
                let checkGoogle = setInterval(function() {
                    if (typeof google !== "undefined" && google.script) {
                        clearInterval(checkGoogle);
                        
                        // Fire the exact same function the button normally runs
                        if (loginBtn.onclick) {
                            loginBtn.onclick();
                        } else if (typeof authenticateUser === "function") {
                            authenticateUser();
                        }
                    }
                }, 250);
            }

            // 2. Save session memory only when they explicitly click it
            loginBtn.addEventListener("click", function() {
                sessionStorage.setItem("bimbot_user_logged_in", "true");
                
                // Set visuals for manual click
                loginBtn.innerHTML = '<svg class="animate-spin w-5 h-5 mr-3 text-blue-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span class="text-blue-600">מתחבר...</span>';
                loginBtn.style.pointerEvents = "none";
                loginBtn.classList.add("opacity-75");
            });
        }
    });
  </script>
