            panel.append(node('p', 'publish-no-views', (liveViewsReady && model.viewsMessage) || (status === 'EMPTY' || status === 'READ_AVAILABLE' || status === 'LOADED' ? 'לא התקבלו פרטי תצוגות בצילום הנתונים.' : status === 'READ_FAILED' || status === 'ERROR' ? 'קריאת התצוגות נכשלה.' : 'פתח את המודל כדי לטעון את רשימת התצוגות מ-Autodesk.')));

              window.loadPublishModelViews(model).then(function(result){model._liveViewsLoading=false;if(!result||!result.model)return;if(!state.selectedProject||String(state.selectedProject.no)!==String(model.projectNo))return;renderPublishControl(snapshot);}).catch(function(error){model._liveViewsLoading=false;model._liveViewsFailed=true;model.viewsStatus='READ_FAILED';model.viewsMessage='לא ניתן לטעון את תצוגות המודל: '+String(error&&error.message||error||'שגיאה');if(state.selectedProject&&String(state.selectedProject.no)===String(model.projectNo))renderPublishControl(snapshot);});return;

            panel.querySelectorAll('.publish-card').forEach(function(card){var view=card._publishView;var image=card.querySelector('img');if(!image){image=document.createElement('img');image.hidden=true;image.alt='';card.querySelector('.publish-card-visual').append(image);}var placeholder=card.querySelector('.publish-card-placeholder');if(placeholder)placeholder.textContent='טוען תמונה…';showThumbnail(image,view,model).then(function(src){if(!placeholder)return;if(src&&!image.hidden)placeholder.hidden=true;else{placeholder.hidden=false;placeholder.textContent='תמונה לא זמינה';}});});
          });

          var web = externalLink(model.webView, 'פתיחת המודל בענן ↗', 'publish-model-link');

          details.append(panel); discipline.append(details);
