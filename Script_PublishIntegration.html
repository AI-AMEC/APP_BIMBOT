<script>
var publishRequestSequence=0,publishAssetCache=Object.create(null),publishModelViewCache=Object.create(null),publishCloudGeneration=0;
function publishReviewToUi_(review){if(!review)return null;return {revision:review.revision,versionId:review.cloudVersionId,updatedAt:review.updatedAt,updatedBy:review.updatedBy,reviewer:review.updatedBy,checks:Object.keys(review.checks||{}).map(function(id){return Object.assign({id:id},review.checks[id]);})};}
function publishGovernanceOverlay_(snapshot,governance,reviews,projectNo){
 var labels={AR:'אדריכלות',ST:'קונסטרוקציה',EL:'חשמל',PL:'אינסטלציה',ME:'מיזוג אוויר',LS:'אדריכלות נוף',SF:'בטיחות אש',SP:'תיאום מערכות',BIM:'ניהול BIM',URS:'URS',GENERAL:'כללי / ללא תחום'};
 snapshot.governanceAvailable=!!(governance&&governance.success);
 snapshot.models.forEach(function(m){var d=snapshot.governanceAvailable?(governance.decisions||{})[m.id]:null;
  m.governance=d||null;m.projectNo=String(projectNo);
  m.controlState=!snapshot.governanceAvailable?'unavailable':!d||!d.classified?'pending':d.controlMode==='ALL'||d.controlMode==='SELECTED'&&(d.controls||[]).indexOf('PUBLISH')>=0?'included':'excluded';
  m.discipline=d&&d.classified?(labels[d.disciplineCode]||d.disciplineCode):'ממתין לסיווג';
  m.review=reviews&&reviews.success?publishReviewToUi_((reviews.reviews||{})[m.id]):null;
  m.reviewWritable=!!(reviews&&reviews.success&&reviews.writable&&m.controlState==='included');
 });return snapshot;
}
function loadPublishControl(){
 var p=state.selectedProject;if(!p)return;var seq=++publishRequestSequence;
 function current(){return seq===publishRequestSequence&&state.selectedProject&&String(state.selectedProject.no)===String(p.no);}
 document.getElementById('publish-content').textContent='טוען תכולת ענן והגדרות הבקרה…';
 google.script.run.withSuccessHandler(function(result){if(!current())return;
  if(!result||!result.available){renderPublishControl(null);return;}
  var snapshot=result.snapshot,governance=null,reviews=null,pending=2;
  function finish(){if(--pending||!current())return;renderPublishControl(publishGovernanceOverlay_(snapshot,governance,reviews,p.no));
   var warnings=[];if(!governance.success)warnings.push('הגדרות השיוך לא נטענו. לא ניתן לקבוע השתתפות בבקרה. '+(governance.error||''));if(!reviews.success)warnings.push('החלטות הבקרה לא נטענו. השמירה חסומה. '+(reviews.error||''));
   if(warnings.length){var notice=document.createElement('p');notice.setAttribute('role','alert');notice.textContent=warnings.join(' ');document.getElementById('publish-content').prepend(notice);}
  }
  google.script.run.withSuccessHandler(function(r){governance=r||{success:false};finish();}).withFailureHandler(function(){governance={success:false};finish();}).getModelGovernance(p.folderId,p.no,p.name);
  google.script.run.withSuccessHandler(function(r){reviews=r||{success:false};finish();}).withFailureHandler(function(){reviews={success:false};finish();}).getPublishReviews(p.folderId,p.no,p.name);
 }).withFailureHandler(function(){if(current())renderPublishControl(null);}).getPublishSnapshot(p.no);
}
window.loadPublishModelViews=function(model){return new Promise(function(resolve,reject){if(!model||!model.projectNo||!model.id||!model.versionId){reject(Error('פרטי המודל או הגרסה חסרים.'));return;}var p=state.selectedProject;if(!p||String(p.no)!==String(model.projectNo)){reject(Error('הפרויקט התחלף; פתח מחדש את בקרת Publish.'));return;}if(model._liveViewsLoaded===true){resolve({model:model});return;}var key=[model.projectNo,model.id,model.versionId].join('|'),generation=publishCloudGeneration;if(publishModelViewCache[key]){publishModelViewCache[key].then(function(data){if(generation!==publishCloudGeneration)throw Error('חיבור Autodesk השתנה. טען מחדש את המודל.');Object.assign(model,data);model._liveViewsLoaded=true;resolve({model:model});}).catch(reject);return;}var seq=publishRequestSequence,projectNo=String(model.projectNo);var pending=new Promise(function(ok,no){google.script.run.withSuccessHandler(function(r){if(seq!==publishRequestSequence||generation!==publishCloudGeneration||!state.selectedProject||String(state.selectedProject.no)!==projectNo){no(Error('חיבור Autodesk או הפרויקט השתנה בזמן הטעינה.'));return;}if(!r||r.success!==true||!r.model){no(Error(r&&r.error||'לא ניתן לטעון את תצוגות המודל.'));return;}var loaded=r.model,details={views:Array.isArray(loaded.views)?loaded.views:[],viewsStatus:(loaded.manifestComplete===true?'LOADED':(loaded.manifestStatus==='UNAVAILABLE'?'READ_FAILED':'READ_AVAILABLE')),viewsMessage:loaded.manifestComplete===true?'':loaded.manifestStatus==='UNAVAILABLE'?'Autodesk לא החזיר Manifest זמין לגרסה זו.':'רשימת התצוגות נטענה; Manifest הענן עשוי להיות חלקי.',manifestComplete:loaded.manifestComplete===true,webView:loaded.webView||model.webView,livePath:loaded.path||''};ok(details);}).withFailureHandler(function(e){no(e||Error('טעינת התצוגות נכשלה.'));}).getLivePublishModel(projectNo,model.id,model.versionId);});publishModelViewCache[key]=pending;pending.catch(function(){delete publishModelViewCache[key];});pending.then(function(data){if(generation!==publishCloudGeneration)throw Error('חיבור Autodesk השתנה. טען מחדש את המודל.');Object.assign(model,data);model._liveViewsLoaded=true;resolve({model:model});}).catch(reject);});};
window.loadPublishThumbnail=function(model,view){var key=model.projectNo+'|'+model.id+'|'+model.versionId;if(!publishAssetCache[key]){var generation=publishCloudGeneration,seq=publishRequestSequence;publishAssetCache[key]=new Promise(function(resolve,reject){google.script.run.withSuccessHandler(function(r){if(seq!==publishRequestSequence||generation!==publishCloudGeneration) return reject(Error('חיבור Autodesk השתנה.'));if(r&&r.success)resolve(r.images||{});else reject(Error(r&&r.error||'אין תמונות זמינות'));}).withFailureHandler(reject).getLivePublishModelThumbnails(model.projectNo,model.id,model.versionId);});}return publishAssetCache[key].then(function(images){if(!images[view.id])throw Error('אין תמונה זמינה');return images[view.id];});};
window.savePublishReview=function(model,payload){return new Promise(function(resolve,reject){var p=state.selectedProject;if(!p||String(p.no)!==model.projectNo){reject(Error('הפרויקט התחלף; יש לפתוח מחדש את הבקרה.'));return;}var checks={};payload.checks.forEach(function(c){checks[c.id]={status:c.status,note:c.note,viewIds:c.viewIds};});google.script.run.withSuccessHandler(function(r){if(!r||!r.success){reject(Error(r&&r.error||'השמירה נכשלה'));return;}resolve({ok:true,review:publishReviewToUi_(r.review),message:'הבקרה נשמרה עם הגרסה, הבודק ותאריך הבדיקה.'});}).withFailureHandler(reject).savePublishReview(p.folderId,p.no,p.name,model.id,model.versionId,{expectedRevision:payload.revision,checks:checks});});};
window.invalidateLiveCloudCache=function(){publishCloudGeneration++;publishRequestSequence++;if(typeof cloudConnectionGeneration!=='undefined')cloudConnectionGeneration++;publishModelViewCache=Object.create(null);publishAssetCache=Object.create(null);['projectCloudPanelCache','projectCloudPanelPending','pilotSnapshotCache','pilotSnapshotPending'].forEach(function(name){var cache=window[name];if(cache&&typeof cache==='object')Object.keys(cache).forEach(function(k){delete cache[k];});});document.querySelectorAll('iframe[id^="cloud-"]').forEach(function(frame){try{frame.srcdoc='';}catch(e){}frame.classList.add('hidden');});document.querySelectorAll('[id^="cloud-"][id$="-message"]').forEach(function(node){node.textContent='מצב חיבור Autodesk השתנה. טען מחדש את תצוגת הענן.';node.classList.remove('hidden');});['publish-content','model-governance-root','unregistered-cloud-body'].forEach(function(id){var root=document.getElementById(id);if(root)root.replaceChildren();});var count=document.getElementById('unregistered-cloud-count');if(count)count.textContent='';var stateLabel=document.getElementById('home-cloud-state');if(stateLabel)stateLabel.textContent='מצב חיבור Autodesk השתנה. יש לטעון מחדש את נתוני הענן.';var modal=document.getElementById('publish-preview-modal'),body=document.getElementById('publish-preview-body'),footer=document.getElementById('publish-preview-footer');if(modal){modal.hidden=true;if(body)body.replaceChildren();if(footer)footer.replaceChildren();}};
window.addEventListener('bimbot:cloud-connection-changed',function(event){window.invalidateLiveCloudCache();var publishTab=document.getElementById('tab-content-publish');if(event&&event.detail&&event.detail.connected===true&&publishTab&&!publishTab.classList.contains('hidden')&&typeof window.loadPublishControl==='function')window.loadPublishControl();});
</script>
