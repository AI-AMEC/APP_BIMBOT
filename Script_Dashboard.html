<script>
    // ==========================================
    // 6. DASHBOARD & DATA TABLES
    // ==========================================
    function updateDashboardStats() {
      const projects = state.projects || [];
      document.getElementById('stat-total').textContent = projects.length;
      document.getElementById('stat-active').textContent = projects.filter(function(p) { return String(p.status || '').toUpperCase() === 'ACTIVE'; }).length; 
      document.getElementById('stat-hold').textContent = projects.filter(function(p) { return String(p.status || '').toUpperCase() === 'ON HOLD'; }).length;
    }

    function renderSourceWarnings(warnings) {
      const container = document.getElementById('source-warnings');
      if (!container) return;
      container.textContent = '';
      const rows = Array.isArray(warnings) ? warnings : [];
      if (!rows.length) { container.classList.add('hidden'); return; }
      const heading = document.createElement('div');
      heading.className = 'font-bold';
      heading.textContent = 'חלק מהנתונים לא נטענו';
      container.appendChild(heading);
      rows.forEach(function(warning) {
        if (!warning) return;
        const line = document.createElement('div');
        line.className = 'mt-1';
        const source = warning.source ? String(warning.source) + ': ' : '';
        const status = warning.status ? ' (' + String(warning.status) + ')' : '';
        line.textContent = warning.source === 'missions' ? 'משימות: לא ניתן לקרוא את שיוכי המשימות; שיוך פרויקטים המבוסס עליהן אינו ידוע.' : source + (warning.message || 'המקור אינו זמין כרגע.') + status;
        container.appendChild(line);
      });
      container.classList.remove('hidden');
    }

    function changeItemsPerPage() { state.itemsPerPage = parseInt(document.getElementById("items-per-page").value); state.currentPage = 1; renderPaginatedProjects(); }
    function prevPage() { if (state.currentPage > 1) { state.currentPage--; renderPaginatedProjects(); } }
    function nextPage() { const maxPage = Math.ceil(state.filteredProjectsArray.length / state.itemsPerPage); if (state.currentPage < maxPage) { state.currentPage++; renderPaginatedProjects(); } }

    function renderPaginatedProjects() {
        const maxPage = Math.ceil(state.filteredProjectsArray.length / state.itemsPerPage) || 1;
        document.getElementById("page-info").innerText = 'עמוד ' + state.currentPage + ' מתוך ' + maxPage;
        document.getElementById("btn-prev-page").disabled = (state.currentPage === 1); 
        document.getElementById("btn-next-page").disabled = (state.currentPage === maxPage);
        const startIndex = (state.currentPage - 1) * state.itemsPerPage; 
        const endIndex = startIndex + state.itemsPerPage;
        const paginatedData = state.filteredProjectsArray.slice(startIndex, endIndex);
        renderDashboardProjects(paginatedData);
    }

    function populateDropdowns(projects) {
      if(!projects || !projects.length) return;
      
      const managerSelect = document.getElementById("filter-manager"); 
      managerSelect.innerHTML = '<option value="All">כל מנהלי BIM</option>';
      [...new Set(projects.map(function(p) { return p.manager; }))].filter(function(m) { return m && m.trim() !== "—" && m.trim() !== ""; }).sort().forEach(function(mgr) { managerSelect.innerHTML += '<option value="' + mgr + '">' + mgr + '</option>'; });

      const statusSelect = document.getElementById("filter-status"); 
      statusSelect.innerHTML = '<option value="Active & On Hold">פעילים ובהמתנה</option><option value="COMPLETED">הושלמו</option><option value="All">כל הסטטוסים</option>';
      statusSelect.value = "Active & On Hold";

      const coordSelect = document.getElementById("filter-coordinator"); 
      coordSelect.innerHTML = '<option value="All">כל המתאמים</option>';
      [...new Set(projects.map(function(p) { return p.coordinator; }))].filter(function(c) { return c && c.trim() !== "—" && c.trim() !== ""; }).sort().forEach(function(c) { coordSelect.innerHTML += '<option value="' + c + '">' + c + '</option>'; });

      const leaderSelect = document.getElementById("filter-leader"); 
      leaderSelect.innerHTML = '<option value="All">כל מובילי BIM</option>';
      [...new Set(projects.map(function(p) { return p.teamLeader; }))].filter(function(l) { return l && l.trim() !== "—" && l.trim() !== ""; }).sort().forEach(function(l) { leaderSelect.innerHTML += '<option value="' + l + '">' + l + '</option>'; });

      const deptSelect = document.getElementById("filter-department"); 
      deptSelect.innerHTML = '<option value="All">כל המחלקות</option>';
      [...new Set(projects.map(function(p) { return p.department; }))].filter(function(d) { return d && d.trim() !== "—" && d.trim() !== ""; }).sort().forEach(function(d) { deptSelect.innerHTML += '<option value="' + d + '">' + d + '</option>'; });
    }

    function renderDashboardProjects(dataToRender) {
      const tbody = document.getElementById("dashboard-project-list");
      if (!dataToRender || dataToRender.length === 0) { 
        tbody.innerHTML = '<tr><td colspan="10" class="p-12 text-center text-slate-400 font-medium">לא נמצאו פרויקטים התואמים לחיפוש.</td></tr>'; 
        return; 
      }
      
      tbody.innerHTML = dataToRender.map(function(prj) {
        const localData = safeGetLocal('bim_project_' + prj.no); 
        
        let prjCode = "—";
        if (localData && localData.bimInfo && localData.bimInfo.code !== undefined) {
            prjCode = localData.bimInfo.code || "—";
        } else {
            prjCode = prj.projectCode && prj.projectCode !== "—" ? prj.projectCode : "—";
        }
        
        let statusText = (prj.status || 'UNKNOWN').toString().trim().toUpperCase();
        let statusBadgeColor = statusText === "ACTIVE" ? "bg-emerald-100 text-emerald-700" : statusText === "ON HOLD" ? "bg-amber-100 text-amber-700" : statusText === "COMPLETED" ? "bg-blue-100 text-blue-700" : "bg-red-100 text-red-700";
        let statusDisplayText = statusText === "ACTIVE" ? "פעיל" : statusText === "ON HOLD" ? "בהמתנה" : statusText === "COMPLETED" ? "הושלם" : statusText === "UNKNOWN" ? "לא ידוע" : statusText;
        
        // Show mission badge ONLY if this project is a mission for the currently logged-in user
        let missionBadge = prj.isUserMission 
            ? '<span class="ml-2 bg-indigo-100 text-indigo-700 text-[9px] px-1.5 py-0.5 rounded font-bold uppercase" title="המשימה שהוקצתה לך">משימה</span>' 
            : '';

        return '<tr class="hover:bg-slate-50 cursor-pointer border-b border-slate-100 transition relative group" onclick="openProjectDetails(\'' + prj.no + '\')">' +
              '<td class="py-3 px-3"><div class="absolute left-0 top-0 bottom-0 w-1 bg-transparent group-hover:bg-orange-400 transition"></div><div class="flex flex-col"><div class="flex items-center"><span class="font-bold text-slate-800 text-sm">' + prj.name + '</span>' + missionBadge + '</div><span class="text-xs text-slate-400 font-mono">' + prj.no + '</span></div></td>' +
              '<td class="py-3 px-3 text-sm font-semibold text-slate-600">' + prjCode + '</td>' +
              '<td class="py-3 px-3"><span class="' + statusBadgeColor + ' text-xs px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">' + statusDisplayText + '</span></td>' +
              '<td class="py-3 px-3 text-xs text-slate-600">' + (prj.manager || '—') + '</td>' +
              '<td class="py-3 px-3 text-xs text-slate-600 font-mono">' + (prj.bimLoad || '—') + '</td>' +
              '<td class="py-3 px-3 text-xs text-slate-600">' + (prj.coordinator || '—') + '</td>' +
              '<td class="py-3 px-3 text-xs text-slate-600 font-mono">' + (prj.mepLoad || '—') + '</td>' +
              '<td class="py-3 px-3 text-xs font-semibold text-blue-700">' + (prj.teamLeader || '—') + '</td>' +
              '<td class="py-3 px-3 text-xs text-slate-600">' + (prj.department || '—') + '</td>' +
              '<td class="py-3 px-3 text-xs text-slate-400 font-mono">זה עתה</td>' +
            '</tr>';
      }).join('');
    }

    function filterProjects() {
      const textQuery = (document.getElementById("project-search") ? document.getElementById("project-search").value : "").toLowerCase();
      const sMgr = document.getElementById("filter-manager") ? document.getElementById("filter-manager").value : "All";
      const sStat = document.getElementById("filter-status") ? document.getElementById("filter-status").value : "Active & On Hold";
      const sCoord = document.getElementById("filter-coordinator") ? document.getElementById("filter-coordinator").value : "All";
      const sLdr = document.getElementById("filter-leader") ? document.getElementById("filter-leader").value : "All";
      const sDept = document.getElementById("filter-department") ? document.getElementById("filter-department").value : "All";
      
      const filtered = (state.projects || []).filter(function(p) {
        let pStat = (p.status || "").trim().toUpperCase();
        let matchStat = false;
        
        if (sStat === "Default" || sStat === "Active & On Hold" || sStat.toUpperCase() === "ACTIVE & ON HOLD") {
            matchStat = (pStat === "ACTIVE" || pStat === "ON HOLD");
        } else if (sStat === "All") {
            matchStat = true;
        } else {
            matchStat = (pStat === sStat.toUpperCase());
        }

        let mEmps = p.missionEmployees || [];

        // Personnel checks
        let passManager = (sMgr === "All" || p.manager === sMgr || mEmps.includes(sMgr));
        let passCoord = (sCoord === "All" || p.coordinator === sCoord || mEmps.includes(sCoord));
        let passLeader = (sLdr === "All" || p.teamLeader === sLdr || mEmps.includes(sLdr));

        return ((p.no || "").toLowerCase().includes(textQuery) || (p.name || "").toLowerCase().includes(textQuery)) && 
               passManager && 
               matchStat && 
               passCoord && 
               passLeader && 
               (sDept === "All" || p.department === sDept);
      });

      state.filteredProjectsArray = filtered; 
      state.currentPage = 1; 
      renderPaginatedProjects();
    }

    function hideGoogleButton() {
        try {
            const btns = document.querySelectorAll('button, a, div');
            btns.forEach(b => {
                if (b.innerText && b.innerText.includes("המשך באמצעות Google")) {
                    b.style.display = "none";
                }
            });
        } catch(e) {}
    }

    function refreshDatabase() {
      // Verify auth or check active session memory
      if (!state.isAuthenticated) { 
          if (sessionStorage.getItem('bim_logged_in') === 'true') {
              state.isAuthenticated = true;
          } else {
              showToast("יש להתחבר תחילה באמצעות Google.", "error"); 
              return; 
          }
      }
      
      // Secure the session so user doesn't have to login again
      sessionStorage.setItem('bim_logged_in', 'true');
      hideGoogleButton();

      const syncBtn = document.getElementById("btn-sync-data"); 
      const syncIcon = document.getElementById("icon-sync");
      if(syncIcon) syncIcon.classList.add("animate-spin"); 
      if(syncBtn) syncBtn.disabled = true;

      google.script.run.withSuccessHandler(function(res) {
        if(res && res.success) { 
          state.projects = res.data || []; 
          safeSetLocal('bim_all_projects', state.projects);
          state.sourceWarnings = Array.isArray(res.sourceWarnings) ? res.sourceWarnings : [];
          safeSetLocal('bim_source_warnings', JSON.stringify(state.sourceWarnings));
          renderSourceWarnings(state.sourceWarnings);
          populateDropdowns(state.projects); 
          filterProjects(); 
          updateDashboardStats(); 
          showToast("המערכת עודכנה בהצלחה", "success"); 
        } else {
          showToast("שגיאה בעדכון הנתונים: " + (res ? res.error : "שגיאה לא מוכרת"), "error");
        }
        if(syncIcon) syncIcon.classList.remove("animate-spin"); 
        if(syncBtn) syncBtn.disabled = false;
      }).withFailureHandler(function(err) {
        showToast("שגיאה בקבלת נתוני הפרויקט: " + err.message, "error");
        if(syncIcon) syncIcon.classList.remove("animate-spin"); 
        if(syncBtn) syncBtn.disabled = false;
      }).getCachedProjectData();

      google.script.run.withSuccessHandler(function(res) {
        if(res && res.success) { 
          state.processData = res.data; 
          state.uniqueProcesses = [...new Set(res.data.map(function(p) { return p.process; }))]; 
          renderProcessMenu(); 
        }
      }).getProcessTableData();
      
      google.script.run.withSuccessHandler(function(res) { 
        if(res && res.success) { populateDynamicDropdowns(res.data); } 
      }).getDropdownData();
    }

    function renderIdHubProjects() {
        const tbody = document.getElementById("id-hub-projects-list"); 
        if (!tbody) return;
        if (!state.projects || state.projects.length === 0) { 
          tbody.innerHTML = '<tr><td colspan="3" class="py-4 px-4 text-center text-slate-400">לא נמצאו פרויקטים פעילים.</td></tr>'; 
          return; 
        }
        tbody.innerHTML = state.projects.map(function(p) { return '<tr class="hover:bg-slate-50 transition"><td class="py-3 px-4 font-mono text-slate-600">' + p.no + '</td><td class="py-3 px-4 font-semibold text-slate-800">' + p.name + '</td><td class="py-3 px-4 font-mono text-xs text-blue-600 bg-blue-50/50">' + (p.folderId || 'מזהה חסר') + '</td></tr>'; }).join('');
    }

    // Initialize automatically when the app loads
    document.addEventListener("DOMContentLoaded", function() {
        if (sessionStorage.getItem('bim_logged_in') === 'true') {
            // User already logged in during this Chrome session
            state.isAuthenticated = true;
            hideGoogleButton();
            
            const cachedProjects = safeGetLocal('bim_all_projects');
            if (cachedProjects && cachedProjects.length) {
                state.projects = cachedProjects;
                state.sourceWarnings = safeGetLocal('bim_source_warnings') || [];
                renderSourceWarnings(state.sourceWarnings);
                populateDropdowns(state.projects);
                filterProjects();
                updateDashboardStats();
            }
            refreshDatabase();
        } else {
            // User is NOT logged in. Show a lock screen instead of empty cache.
            state.projects = [];
            const tbody = document.getElementById("dashboard-project-list");
            if (tbody) {
                tbody.innerHTML = '<tr><td colspan="10" class="p-16 text-center text-slate-500"><svg class="w-12 h-12 mx-auto text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg><span class="font-bold text-lg text-slate-700">הגישה למסד הנתונים נעולה</span><br><span class="text-sm mt-1 block">יש ללחוץ על "המשך באמצעות Google" בפינה העליונה כדי לגשת לפרויקטים.</span></td></tr>';
            }
            
            const total = document.getElementById('stat-total'); if(total) total.textContent = '0';
            const active = document.getElementById('stat-active'); if(active) active.textContent = '0';
            const hold = document.getElementById('stat-hold'); if(hold) hold.textContent = '0';
        }
    });
</script>
