<script>
    // ==========================================
    // BIM COMMANDER / DOCUMENT GENERATOR
    // ==========================================
    function toggleBdgDropdown(show) { const list = document.getElementById('bdg-project-dropdown-list'); if(list) { if(show) list.classList.remove('hidden'); else list.classList.add('hidden'); } }

    function filterBdgDropdown() {
        const query = document.getElementById('bdg-project-search-input').value.toLowerCase();
        const items = document.querySelectorAll('.bdg-dropdown-item'); let visibleCount = 0;
        
        items.forEach(item => { if (item.innerText.toLowerCase().includes(query)) { item.style.display = 'block'; visibleCount++; } else { item.style.display = 'none'; } });
        
        const emptyMsg = document.getElementById('bdg-dropdown-empty');
        if(visibleCount === 0) {
            if(!emptyMsg) document.getElementById('bdg-project-dropdown-list').innerHTML += `<div id="bdg-dropdown-empty" class="p-3 text-sm text-slate-400 text-center">לא נמצאו פרויקטים</div>`; else emptyMsg.style.display = 'block';
        } else if(emptyMsg) emptyMsg.style.display = 'none';
    }

    function selectBdgProject(no, name) {
        const searchInput = document.getElementById('bdg-project-search-input'); if (searchInput) searchInput.value = `${no} - ${name}`;
        const hiddenInput = document.getElementById('bdg-target-project'); if (hiddenInput) hiddenInput.value = no;
        toggleBdgDropdown(false); renderBdgFilesTable();
    }

    function populateBdgProjectDropdown() {
        const list = document.getElementById("bdg-project-dropdown-list"); const hiddenInput = document.getElementById("bdg-target-project"); const searchInput = document.getElementById("bdg-project-search-input");
        if (!list) return;
        
        const availableProjects = (state.allProjects && state.allProjects.length) ? state.allProjects : state.projects;
        
        const currentVal = hiddenInput.value; let html = '';
        availableProjects.forEach(p => { html += `<div class="bdg-dropdown-item cursor-pointer px-4 py-2 hover:bg-blue-50 border-b border-slate-50 last:border-0 text-sm font-medium text-slate-700 transition" onclick="selectBdgProject('${p.no}', '${p.name.replace(/'/g, "\\'")}')">${p.no} - ${p.name}</div>`; });
        list.innerHTML = html;
        if (currentVal && availableProjects.some(p => p.no === currentVal)) { const proj = availableProjects.find(p => p.no === currentVal); hiddenInput.value = proj.no; searchInput.value = `${proj.no} - ${proj.name}`; } else if (state.selectedProject) { hiddenInput.value = state.selectedProject.no; searchInput.value = `${state.selectedProject.no} - ${state.selectedProject.name}`; } else { hiddenInput.value = ""; searchInput.value = ""; }
        renderBdgFilesTable();
    }

    function renderProcessMenu() { document.getElementById("bdg-process-list").innerHTML = state.uniqueProcesses.map(proc => `<button type="button" onclick="selectBdgProcess('${proc}')" id="btn-proc-${proc.replace(/\s+/g, '')}" class="w-full text-left text-xs font-semibold px-3 py-2.5 rounded-lg border hover:bg-white bg-slate-100 text-slate-700 transition">${proc}</button>`).join(''); }

    function selectBdgProcess(procName) {
      state.selectedProcessName = procName;
      state.uniqueProcesses.forEach(p => { document.getElementById(`btn-proc-${p.replace(/\s+/g, '')}`).className = (p === procName) ? "w-full text-left text-xs font-bold px-3 py-2.5 rounded-lg border-l-4 border-blue-600 bg-blue-50 text-blue-900 transition" : "w-full text-left text-xs font-semibold px-3 py-2.5 rounded-lg border border-slate-200 hover:bg-white bg-slate-100 text-slate-700 transition"; });
      state.bdgFiles = state.processData.filter(f => f.process === procName).map(f => ({...f, checked: true})); state.filteredBdgFiles = [...state.bdgFiles]; populateDocTypeFilterOptions();
      const btn = document.getElementById("btn-bdg-generate-trigger"); btn.disabled = false; btn.classList.replace("bg-slate-100", "bg-blue-600"); btn.classList.replace("text-slate-400", "text-white"); btn.classList.remove("cursor-not-allowed");
      renderBdgFilesTable(); const successBox = document.getElementById("bdg-success-links"); if(successBox) successBox.classList.add("hidden");
    }

    function populateDocTypeFilterOptions() {
      const select = document.getElementById("filter-doc-type"); if(!select) return; select.innerHTML = '<option value="All">סוג מסמך</option>';
      [...new Set(state.bdgFiles.map(f => f.type))].filter(t => t.trim() !== "").sort().forEach(type => { const option = document.createElement("option"); option.value = type; option.textContent = type; select.appendChild(option); });
    }

    function filterBdgFilesByDocType() {
      const select = document.getElementById("filter-doc-type"); if(!select) return;
      state.filteredBdgFiles = select.value === "All" ? [...state.bdgFiles] : state.bdgFiles.filter(f => f.type === select.value); renderBdgFilesTable();
    }

    function renderBdgFilesTable() {
      const tbody = document.getElementById("tbl-bdg-files"); const projSelect = document.getElementById("bdg-target-project"); let targetProjNo = projSelect ? projSelect.value : "";
      let prefix = "PREFIX_";
      if (targetProjNo) { const localData = safeGetLocal('bim_project_' + targetProjNo); const customCode = (localData.bimInfo && localData.bimInfo.code) ? localData.bimInfo.code : targetProjNo; prefix = customCode + "_"; }

      if(state.filteredBdgFiles.length === 0) { tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400">לא נמצאו תבניות התואמות למסננים שנבחרו.</td></tr>`; return; }
      tbody.innerHTML = state.filteredBdgFiles.map((f, i) => `<tr class="hover:bg-slate-50 transition"><td class="p-2"><input type="checkbox" ${f.checked?'checked':''} class="rounded w-4 h-4 text-blue-600 cursor-pointer" onchange="state.filteredBdgFiles[${i}].checked=this.checked"></td><td class="p-2 font-semibold text-slate-800">${prefix}${f.fileName}</td><td class="p-2"><span class="px-2 py-0.5 rounded text-xxs font-semibold ${f.type==='טמפלייט' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : f.type==='מדריכים' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}">${f.type}</span></td><td class="p-2 text-slate-400 font-mono text-xxs">${f.fileId}</td></tr>`).join('');
    }

    function toggleAllBdgFiles(isChecked) { state.filteredBdgFiles.forEach(f => f.checked = isChecked); renderBdgFilesTable(); }

    function triggerBdgConfirmation() {
      const projSelect = document.getElementById("bdg-target-project"); const targetProjNo = projSelect ? projSelect.value : "";
      if (!targetProjNo) { showToast("יש לבחור תחילה פרויקט יעד.", "error"); return; }

      const localData = safeGetLocal('bim_project_' + targetProjNo); const customCode = (localData.bimInfo && localData.bimInfo.code) ? localData.bimInfo.code : targetProjNo; const prefix = customCode + '_';
      const container = document.getElementById("confirm-files-list"); const active = state.filteredBdgFiles.filter(f => f.checked);

      if (active.length === 0) { 
          container.innerHTML = "<p class='p-4 text-slate-400 text-center font-bold'>לא נבחרו קבצים גלויים. יש לסנן או לסמן קבצים תחילה.</p>"; 
      } else { 
          container.innerHTML = active.map(f => `<div class="flex items-center justify-between border-b border-slate-100 py-1.5"><div class="flex items-center space-x-2"><input type="checkbox" checked class="rounded w-4 h-4 text-blue-600 confirm-file-selector" data-id="${f.fileId}" data-name="${f.fileName}" data-type="${f.type}"><span class="font-semibold text-slate-700 font-mono text-xxs">${prefix}${f.fileName}</span></div><span class="text-slate-400 text-xxs font-mono border rounded px-2 py-0.5 bg-white">יעד: BIM / ${f.type==='מדריכים'?'מדריכים':state.selectedProcessName}</span></div>`).join(''); 
      }
      document.getElementById("modal-bdg-confirm").classList.remove("hidden");
    }

    function executeBdgGeneration() {
      const projSelect = document.getElementById("bdg-target-project"); const targetProjNo = projSelect ? projSelect.value : "";
      if (!targetProjNo) return showToast("יש לבחור פרויקט יעד.", "error");

      const availableProjects = (state.allProjects && state.allProjects.length) ? state.allProjects : state.projects;
      const targetProj = availableProjects.find(p => p.no === targetProjNo); if(!targetProj || !targetProj.folderId) return showToast("לפרויקט שנבחר אין מזהה תיקיית Drive.", "error");

      const selected = []; document.querySelectorAll(".confirm-file-selector").forEach(cb => { if(cb.checked) selected.push({ fileId: cb.getAttribute("data-id"), fileName: cb.getAttribute("data-name"), type: cb.getAttribute("data-type") }); });
      if(selected.length===0) return showToast("יש לבחור לפחות קובץ אחד לביצוע.", "error");

      const localData = safeGetLocal('bim_project_' + targetProjNo); const prefixToUse = (localData.bimInfo && localData.bimInfo.code) ? localData.bimInfo.code : targetProjNo;
      const btn = document.getElementById("btn-exec-bdg"); btn.innerHTML = "מבצע..."; btn.disabled = true;

      google.script.run.withSuccessHandler(res => {
        if(res.success) { 
          showToast(`${res.count} מסמכים נוצרו בהצלחה!`, "success"); document.getElementById('modal-bdg-confirm').classList.add('hidden'); 

          const successBox = document.getElementById("bdg-success-links");
          let filesHtml = res.files.map(f => `<a href="${f.url}" target="_blank" class="block text-blue-600 hover:text-blue-800 hover:underline truncate text-xs py-1.5 flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg> ${f.name}</a>`).join('');

          successBox.innerHTML = `<div class="flex items-center justify-between border-b border-emerald-200 pb-2 mb-2"><span class="font-bold text-emerald-800 text-sm flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> נוצר בהצלחה!</span><a href="${res.folderUrl}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition flex items-center gap-2">📁 פתיחת תיקייה</a></div><div class="space-y-1 pl-1"><span class="text-xs font-bold text-emerald-700 mb-1 block uppercase">קבצים שנוצרו:</span>${filesHtml}</div>`;
          successBox.classList.remove("hidden");
        } else { showToast("שגיאה: " + res.error, "error"); }
        btn.innerHTML = "אישור וביצוע"; btn.disabled = false;
      }).generateProjectFiles(targetProj.folderId, targetProj.no, targetProj.name, prefixToUse, state.selectedProcessName, selected);
    }

    function generateKickoffDoc() {
        const proj = state.selectedProject; if(!proj || !proj.folderId) return;
        const requestedProjectNo = String(proj.no); // CAPTURE ID FOR RACE GUARD

        const btn = document.getElementById("btn-gen-kickdoc"); const originalText = btn.innerHTML;
        btn.innerHTML = '<svg class="animate-spin w-3 h-3 mr-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> יוצר מסמך...';
        btn.disabled = true; btn.classList.add("opacity-75", "cursor-wait"); document.getElementById("kickoff-doc-success").classList.add("hidden");

        const payload = { 
            bimInfo: state.bimInfo, kickoff: state.kickoff, liveLink: state.liveLink, sharedLink: state.sharedLink, 
            contacts: state.contacts, basements: state.mdcBasements, models: buildModelsArray(),
            colOrder: getColOrder(), colVis: getColVis() 
        };

        google.script.run.withSuccessHandler(res => {
            // Guard applied here too
            if (!state.selectedProject || String(state.selectedProject.no) !== requestedProjectNo) return; 

            btn.innerHTML = originalText; btn.disabled = false; btn.classList.remove("opacity-75", "cursor-wait");
            if(res.success && res.url) {
                showToast("המסמך נוצר בהצלחה!", "success"); const successDiv = document.getElementById("kickoff-doc-success");
                document.getElementById("kickoff-doc-link").href = res.url; successDiv.classList.remove("hidden");
            } else { showToast("יצירת המסמך נכשלה: " + (res.error || "שגיאה לא מוכרת"), "error"); }
        }).withFailureHandler(err => {
            if (!state.selectedProject || String(state.selectedProject.no) !== requestedProjectNo) return; 
            btn.innerHTML = originalText; btn.disabled = false; btn.classList.remove("opacity-75", "cursor-wait"); showToast("יצירת המסמך נכשלה: " + err.message, "error");
        }).generateKickoffDoc(proj.folderId, proj.no, proj.name, payload);
    }
</script>
