                const cellValues = {
                    'code': `<input type="text" class="w-full border border-transparent hover:border-slate-200 rounded px-2 py-1.5 text-xs focus:border-blue-500 outline-none text-slate-800 font-bold font-mono transition bg-transparent" value="${safeCode}" onchange="updateModelOverrideAndSync('${m.id}', 'code', this.value, '${safeCode}', this)">`,
                    'projectCode': `<input type="text" class="w-full border border-transparent hover:border-slate-200 rounded px-2 py-1.5 text-xs focus:border-blue-500 outline-none text-slate-600 font-semibold font-mono transition bg-transparent" value="${safeProj}" onchange="updateModelOverrideAndSync('${m.id}', 'projectCode', this.value, '${safeProj}')">`,
                    'discCode': `<input type="text" class="w-full border border-transparent hover:border-slate-200 rounded px-2 py-1.5 text-xs focus:border-blue-500 outline-none text-blue-600 font-bold transition bg-transparent" value="${safeDisc}" onchange="updateModelOverrideAndSync('${m.id}', 'discCode', this.value, '${safeDisc}')">`,
                    'bldgCode': `<input type="text" class="w-full border border-transparent hover:border-slate-200 rounded px-2 py-1.5 text-xs focus:border-blue-500 outline-none text-blue-600 font-bold transition bg-transparent" value="${safeBldg}" onchange="updateModelOverrideAndSync('${m.id}', 'bldgCode', this.value, '${safeBldg}')">`,
                    'lotCode': `<input type="text" class="w-full border border-transparent hover:border-slate-200 rounded px-2 py-1.5 text-xs focus:border-blue-500 outline-none text-blue-600 font-bold transition bg-transparent" value="${safeLot}" onchange="updateModelOverrideAndSync('${m.id}', 'lotCode', this.value, '${safeLot}')">`,
                    'desc': `<input type="text" class="w-full border border-transparent hover:border-slate-200 rounded px-2 py-1.5 text-xs focus:border-blue-500 outline-none text-slate-700 font-medium transition bg-transparent" value="${safeDesc}" onchange="updateModelOverrideAndSync('${m.id}', 'desc', this.value, '${safeDesc}')">`,
                    'comment': `<input type="text" class="w-full border border-transparent hover:border-slate-200 rounded px-2 py-1.5 text-xs focus:border-blue-500 outline-none text-slate-700 font-medium transition bg-transparent" value="${safeComment}" onchange="updateModelOverrideAndSync('${m.id}', 'comment', this.value, '${safeComment}')">`
                };

                currentOrder.forEach(col => {
                    let visClass = state.colVis[col] ? '' : 'hidden';
                    let dirAttr = colDef[col].dir === 'rtl' ? 'dir="rtl"' : '';
                    tbodyHtml += `<td class="py-2 px-2 ${visClass}" ${dirAttr}>${cellValues[col]}</td>`;
                });

                const accEdited = m.isCustom || (state.modelOverrides[m.id] && state.modelOverrides[m.id].code !== undefined && state.modelOverrides[m.id].code !== m.id);
                tbodyHtml += `<td class="py-2 px-3 text-xs min-w-52" data-acc-model-code="${encodeURIComponent(m.code || '')}" data-acc-model-edited="${accEdited ? 'true' : 'false'}"><span class="text-slate-400">סריקת ענן לא נטענה</span></td>`;
                tbodyHtml += `<td class="py-2 px-2 text-center text-slate-300 hover:text-red-500 cursor-pointer transition" onclick="removeModel('${m.id}', ${isCustom})" title="הסרת מודל">
                        <svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </td>
                </tr>`;
            });

            tbodyHtml += `</tbody>`;
            table.innerHTML = theadHtml + tbodyHtml;
            if (typeof applyPilotSnapshotToModelTable === 'function' && state.selectedProject) applyPilotSnapshotToModelTable(state.selectedProject.no);
            if (state.mdcCurrentStep === 4 && typeof ensurePilotCloudSnapshot === 'function') ensurePilotCloudSnapshot();

        } catch(e) {
            console.error("renderFinalModelTable error:", e);
        }
    }

    function regenerateModelTableFromDecomposition() {
        if (!window.confirm('להחליף את רישום המודלים הנוכחי בטבלה חדשה שנוצרה מהפירוק? שורות מודל מותאמות, עריכות וסדר ידני יוחלפו.')) return;
        state.modelOverrides = {};
        state.addedModels = [];
        state.deletedModels = [];
        state.modelOrder = [];
        state.modelOrderDirty = false;
        markModelsDirty(true);
        saveLocalState();
        renderFinalModelTable();
    }

    function addCustomModel() {
       markModelsDirty(false);
       if(!state.addedModels) state.addedModels = [];
       let prefix = state.bimInfo.code ? state.bimInfo.code : state.selectedProject.no;
       state.addedModels.push({
           id: 'custom_' + Date.now(),
           code: prefix + '-NEW',
           discCode: 'XX',
           desc: 'New Model',
           comment: '',
           projectCode: prefix,
           bldgCode: '',
           lotCode: '',
           isCustom: true
       });
       saveLocalState();
       renderFinalModelTable();
    }

    function removeModel(id, isCustom) {
       markModelsDirty(false);
       if(isCustom) {
           state.addedModels = state.addedModels.filter(m => m.id !== id);
           if(state.modelOverrides[id]) delete state.modelOverrides[id];
       } else {
           if(!state.deletedModels) state.deletedModels = [];
           state.deletedModels.push(id);
       }
       state.modelOrder = state.modelOrder.filter(mId => mId !== id);
       saveLocalState();
       renderFinalModelTable();
    }
</script>
