<script>
    // ==========================================
    // 8. MDC (MODEL DECOMPOSITION) LOGIC
    // ==========================================
    
    const TRASH_ICON = '<svg class="w-4 h-4 text-slate-400 hover:text-red-500 transition mx-auto cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';

    function markModelsDirty(regenerate) {
        state.modelsDirty = true;
        if (regenerate === true) state.regenerateModels = true;
    }

    function cleanOrphanedData() {
        if (!state.mdcBuildings) state.mdcBuildings = [];
        if (!state.siteGroups) state.siteGroups = [];
        if (!state.designOptions) state.designOptions = [];
        
        let validBldgNames = state.mdcBuildings
            .filter(b => b && b.name && b.name.trim() !== "")
            .map(b => b.name.trim());

        if (state.siteGroups) {
            state.siteGroups.forEach(g => {
                g.buildings = (g.buildings || []).filter(bName => validBldgNames.includes(bName));
            });
            state.siteGroups = state.siteGroups.filter(g => g.buildings && g.buildings.length >= 2);
        }

        if (state.designOptions) {
            let validGroupNames = state.siteGroups.map(g => g.name);
            state.designOptions = state.designOptions.filter(opt => {
                if (opt.isGroupTarget) {
                    return validGroupNames.includes(opt.targetCode);
                } else {
                    return validBldgNames.includes(opt.targetCode);
                }
            });
        }

        syncSiteGroupsToLegacy();
    }

    function escapeMdcSummaryText(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function(char) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];
      });
    }

    function renderDecompositionRelationshipSummary() {
      const firstBadge = document.getElementById('step-badge-1');
      const stepNav = firstBadge && firstBadge.parentElement && firstBadge.parentElement.parentElement;
      if (!stepNav) return;
      let summary = document.getElementById('mdc-relationship-summary');
      if (!summary) {
        summary = document.createElement('div');
        summary.id = 'mdc-relationship-summary';
        stepNav.parentElement.insertBefore(summary, stepNav);
      }
      summary.className = 'rounded-xl border border-blue-100 bg-blue-50/60 px-4 py-3 text-sm';

      const lots = (state.mdcLots || []).map(lot => String(lot && lot.number || '').trim()).filter(Boolean);
      const buildings = (state.mdcBuildings || []).filter(b => b && String(b.name || '').trim());
      const basements = (state.mdcBasements || []).filter(b => b && String(b.code || '').trim());
      const groups = (state.siteGroups || []).filter(g => g && Array.isArray(g.buildings));
      const lotNames = [...new Set(lots.concat(buildings.map(b => String(b.lot || '').trim()).filter(Boolean)))];
      const lotRelationships = lotNames.map(lot => {
        const names = buildings.filter(b => String(b.lot || '').trim() === lot).map(b => String(b.name).trim());
        return `<span class="inline-flex items-center rounded-md border border-slate-200 bg-white px-2 py-0.5 text-xs text-slate-700">מגרש ${escapeMdcSummaryText(lot || 'ללא שיוך')}: ${names.map(escapeMdcSummaryText).join(' + ') || 'ללא מבנים'}</span>`;
      });
      const groupNames = groups.map(g => {
        const name = escapeMdcSummaryText(g.name || 'ללא שם');
        const members = g.buildings.map(escapeMdcSummaryText).join(' + ');
        return `<span class="inline-flex items-center rounded-md border border-blue-100 bg-white px-2 py-0.5 text-xs text-slate-700" dir="rtl">מודל ${name} ← מבנים ${members || 'ללא שיוך'}</span>`;
      });
      const registerCount = Array.isArray(state.sourceModels) ? state.sourceModels.length :
        (Array.isArray(state.models) ? state.models.length : null);
      const registerLabel = registerCount == null ? 'טרם נטען' : `${registerCount} רשומות במקור השמור`;

      summary.innerHTML = `<div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-slate-700" dir="rtl">
        <span class="font-bold text-slate-900">מבנה הפרויקט</span>
        <span>${lots.length} מגרשים</span><span aria-hidden="true">←</span>
        <span>${buildings.length} מבנים${basements.length ? ` ו־${basements.length} מרתפים` : ''}</span><span aria-hidden="true">←</span>
        <span>${groups.length} קבוצות מודל משותפות</span><span aria-hidden="true">←</span>
        <span>רישום מודלים: ${escapeMdcSummaryText(registerLabel)}</span>
      </div>
      <div class="mt-2 flex flex-wrap gap-1.5" aria-label="מגרשים והמבנים הפיזיים" dir="rtl">${lotRelationships.join('') || '<span class="text-xs text-slate-500">טרם הוגדרו מגרשים או מבנים.</span>'}</div>
      <div class="mt-1.5 flex flex-wrap gap-1.5" aria-label="קבוצות מודל והמבנים המשויכים" dir="rtl">${groupNames.join('') || '<span class="text-xs text-slate-500">אין קבוצות משותפות; כל מבנה נשאר עצמאי.</span>'}</div>
      <p class="mt-1.5 text-[11px] text-slate-500" dir="rtl">רישום המקור נשמר עד לבחירה מפורשת ב״יצירה מחדש מהחלוקה״.</p>`;
    }

    function prepareMdcStepNavigation(activeStep) {
      const firstBadge = document.getElementById('step-badge-1');
      const nav = firstBadge && firstBadge.parentElement && firstBadge.parentElement.parentElement;
      if (nav) nav.setAttribute('role', 'tablist');
      for (let i = 1; i <= 5; i++) {
        const badge = document.getElementById('step-badge-' + i);
        const tab = badge && badge.parentElement;
        const panel = document.getElementById('mdc-step-body-' + i);
        if (tab) {
          tab.setAttribute('role', 'tab');
          tab.setAttribute('tabindex', i === activeStep ? '0' : '-1');
          tab.setAttribute('aria-selected', i === activeStep ? 'true' : 'false');
          tab.setAttribute('aria-controls', 'mdc-step-body-' + i);
          if (!tab.dataset.mdcKeyboardReady) {
            tab.dataset.mdcKeyboardReady = 'true';
            tab.addEventListener('keydown', function(event) {
              if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
                event.preventDefault();
                const current = Number(this.querySelector('[id^="step-badge-"]').id.split('-').pop());
                const delta = event.key === 'ArrowRight' ? 1 : -1;
                const next = ((current - 1 + delta + 5) % 5) + 1;
                setMdcStep(next);
                const nextBadge = document.getElementById('step-badge-' + next);
                if (nextBadge && nextBadge.parentElement) nextBadge.parentElement.focus();
              }
            });
          }
        }
        if (panel) {
          panel.setAttribute('role', 'tabpanel');
          panel.setAttribute('aria-labelledby', 'step-text-' + i);
          panel.setAttribute('tabindex', '0');
        }
      }
    }

    function renderMdcStep(step) {
      renderDecompositionRelationshipSummary();
      prepareMdcStepNavigation(step);
      
      for (let i=1; i<=5; i++) {
        document.getElementById('mdc-step-body-' + i).classList.add("hidden"); 
        let badge = document.getElementById('step-badge-' + i);
        let text = document.getElementById('step-text-' + i);
        badge.className = "w-6 h-6 rounded-full text-center bg-slate-200 text-slate-600 flex items-center justify-center font-bold text-xs";
        text.className = "font-semibold text-slate-500";
      }
      
      document.getElementById('mdc-step-body-' + step).classList.remove("hidden"); 
      document.getElementById('step-badge-' + step).className = "w-6 h-6 rounded-full text-center bg-blue-600 text-white flex items-center justify-center font-bold text-xs";
      document.getElementById('step-text-' + step).className = "font-bold text-slate-800";
      
      document.getElementById("btn-mdc-prev").disabled = (step === 1); 
      document.getElementById("btn-mdc-prev").className = (step===1) ? "bg-slate-100 text-slate-400 font-semibold px-4 py-1.5 rounded-lg cursor-not-allowed" : "bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-semibold px-4 py-1.5 rounded-lg transition shadow-sm";
      
      const btnNext = document.getElementById("btn-mdc-next"); 
      btnNext.classList.remove("hidden");
      
      if (step === 5) { 
          btnNext.innerHTML = "Next &rarr;"; 
          btnNext.onclick = function() { switchTab('kickoff'); }; 
      } else { 
          btnNext.innerHTML = "Next &rarr;"; 
          btnNext.onclick = function() { changeStep(1); }; 
      }
      document.getElementById("btn-mdc-prev").classList.add('hidden');
      btnNext.classList.add('hidden');
      
      if (step===1) { renderLots(); renderBuildings(); renderBasements(); } 
      if (step===2) renderGenModels(); 
      if (step===3) renderDisciplines(); 
      if (step===5 && typeof renderModelSchemaStep === 'function') renderModelSchemaStep();
      if (step===4) { renderFinalModelTable(); if (typeof ensurePilotCloudSnapshot === 'function') ensurePilotCloudSnapshot(); if (typeof loadModelGovernance === 'function') loadModelGovernance(); }
    }
    
    function changeStep(delta) { state.mdcCurrentStep += delta; renderMdcStep(state.mdcCurrentStep); }
    function setMdcStep(stepNumber) { state.mdcCurrentStep = stepNumber; renderMdcStep(state.mdcCurrentStep); }
    
    function addLotRow() { state.mdcLots.push({ number: "" }); renderLots(); saveLocalState(); }

    function renderLots() {
      const tbody = document.getElementById("tbl-lots-body"); 
      if (!tbody) return;
      tbody.innerHTML = state.mdcLots.map(function(l, i) {
          return '<tr><td class="p-3"><input type="text" placeholder="..." class="w-full border border-slate-200 outline-none rounded px-3 py-1.5 text-sm" value="' + (l.number||'') + '" oninput="state.mdcLots[' + i + '].number=this.value; saveLocalState(); renderBuildings(); renderBasements();"></td><td class="p-3 text-center w-16"><div onclick="state.mdcLots.splice(' + i + ',1); renderLots(); cleanOrphanedData(); saveLocalState(); renderBuildings(); renderBasements();">' + TRASH_ICON + '</div></td></tr>';
      }).join('');
      renderDecompositionRelationshipSummary();
    }

    function addBuildingRow() { state.mdcBuildings.push({name:"", desc:"", floors:"", lot:"", gl: false, glValue: ""}); renderBuildings(); saveLocalState(); }

    function renderBuildings() {
      const tbody = document.getElementById("tbl-buildings-body"); 
      if (!tbody) return;
      tbody.innerHTML = state.mdcBuildings.map(function(b, i) {
        const lotOptions = state.mdcLots.map(function(l) { 
            const lotNum = String(l.number || ''); 
            const isSelected = (String(b.lot) === lotNum && lotNum !== '') ? 'selected' : ''; 
            return '<option value="' + lotNum + '" ' + isSelected + '>' + (lotNum || 'מגרש ללא שם') + '</option>'; 
        }).join('');
        
        let glHtml = '<div class="flex items-center justify-center gap-2 pt-1">' +
          '<input type="checkbox" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer" ' + (b.gl?'checked':'') + ' onchange="state.mdcBuildings[' + i + '].gl=this.checked; saveLocalState();">' +
          '<input type="text" placeholder="ערך" class="w-16 border border-slate-200 outline-none rounded px-2 py-1 text-sm text-center" value="' + (b.glValue||'') + '" oninput="state.mdcBuildings[' + i + '].glValue=this.value; saveLocalState();">' +
        '</div>';

        return '<tr><td class="p-3"><input type="text" placeholder="..." class="w-full border border-slate-200 outline-none rounded px-3 py-1.5 text-sm" value="' + (b.name||'') + '" oninput="state.mdcBuildings[' + i + '].name=this.value; cleanOrphanedData(); saveLocalState(); renderBasements();"></td><td class="p-3"><input type="text" placeholder="..." class="w-full border border-slate-200 outline-none rounded px-3 py-1.5 text-sm" value="' + (b.desc||'') + '" oninput="state.mdcBuildings[' + i + '].desc=this.value; saveLocalState();"></td><td class="p-3"><input type="number" placeholder="..." class="w-full border border-slate-200 outline-none rounded px-3 py-1.5 text-sm" value="' + (b.floors||'') + '" oninput="state.mdcBuildings[' + i + '].floors=this.value; saveLocalState();"></td><td class="p-3"><select class="w-full border border-slate-200 bg-white outline-none rounded px-3 py-1.5 text-sm" onchange="state.mdcBuildings[' + i + '].lot=this.value; saveLocalState()"><option value=""></option>' + lotOptions + '</select></td><td class="p-3 text-center align-top w-28">' + glHtml + '</td><td class="p-3 text-center w-16"><div onclick="state.mdcBuildings.splice(' + i + ',1); cleanOrphanedData(); renderBuildings(); saveLocalState(); renderBasements();">' + TRASH_ICON + '</div></td></tr>';
      }).join('');
      renderDecompositionRelationshipSummary();
    }

    function addBasementRow() { state.mdcBasements.push({code:"", desc:"", buildings:"", floors:"", lots:"", gl: false, glValue: ""}); renderBasements(); saveLocalState(); }
    
    function toggleInlineFast(id) { const el = document.getElementById(id); if (el) { el.classList.toggle('hidden'); } }

    function generateChipsHtml(itemsArray, fieldType, basementIdx) {
        if (!itemsArray || itemsArray.length === 0) return '<span class="text-slate-400">בחירה...</span>';
        return '<div class="flex flex-wrap gap-1">' + itemsArray.map(function(item) {
            let escapedItem = String(item).replace(/'/g, "\\'");
            return '<span class="bg-slate-100 border border-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded flex items-center gap-1">' + item + ' <span class="hover:text-red-50 cursor-pointer font-bold ml-1" onclick="event.stopPropagation(); updateBasementMultiSelect(' + basementIdx + ', \'' + fieldType + '\', \'' + escapedItem + '\', false)">&times;</span></span>';
        }).join('') + '</div>';
    }

    function renderBasements() {
      const tbody = document.getElementById("tbl-basements-body"); 
      if (!tbody) return;
      const availableBldgs = state.mdcBuildings.map(function(b) { return String(b.name || ''); }).filter(function(n) { return n.trim() !== ""; }); 
      const availableLots = state.mdcLots.map(function(l) { return String(l.number || ''); }).filter(function(n) { return n.trim() !== ""; });
      
      tbody.innerHTML = state.mdcBasements.map(function(b, i) {
        let selectedBldgs = b.buildings ? String(b.buildings).split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s; }) : []; 
        let selectedLots = b.lots ? String(b.lots).split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s; }) : [];
        
        let chipsBldgs = generateChipsHtml(selectedBldgs, 'buildings', i);
        let bldgsHtml = '<div class="w-full relative"><button type="button" onclick="toggleInlineFast(\'basement-bldgs-' + i + '\')" class="w-full border border-slate-200 bg-white hover:bg-slate-50 rounded px-2 py-1.5 text-xs flex items-center justify-between transition min-h-[34px]"><div id="text-multi-buildings-' + i + '">' + chipsBldgs + '</div><svg class="w-3 h-3 text-slate-400 shrink-0 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></button><div id="basement-bldgs-' + i + '" class="hidden mt-1 absolute z-50 w-full bg-slate-50 border border-slate-200 rounded text-right max-h-40 overflow-y-auto" dir="rtl">' + (availableBldgs.map(function(name) { return '<label class="flex items-center px-3 py-1.5 hover:bg-slate-100 cursor-pointer text-xs border-b border-slate-100 last:border-0"><input type="checkbox" class="ml-2 rounded text-blue-600 focus:ring-blue-500" ' + (selectedBldgs.includes(name) ? 'checked' : '') + ' onchange="updateBasementMultiSelect(' + i + ', \'buildings\', \'' + String(name).replace(/'/g, "\\'") + '\', this.checked)"><span>' + name + '</span></label>'; }).join('') || '<div class="p-2 text-slate-400 text-xs text-center">אין בניינים</div>') + '</div></div>';
        
        let chipsLots = generateChipsHtml(selectedLots, 'lots', i);
        let lotsHtml = '<div class="w-full relative"><button type="button" onclick="toggleInlineFast(\'basement-lots-' + i + '\')" class="w-full border border-slate-200 bg-white hover:bg-slate-50 rounded px-2 py-1.5 text-xs flex items-center justify-between transition min-h-[34px]"><div id="text-multi-lots-' + i + '">' + chipsLots + '</div><svg class="w-3 h-3 text-slate-400 shrink-0 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></button><div id="basement-lots-' + i + '" class="hidden mt-1 absolute z-50 w-full bg-slate-50 border border-slate-200 rounded text-right max-h-40 overflow-y-auto" dir="rtl">' + (availableLots.map(function(num) { return '<label class="flex items-center px-3 py-1.5 hover:bg-slate-100 cursor-pointer text-xs border-b border-slate-100 last:border-0"><input type="checkbox" class="ml-2 rounded text-blue-600 focus:ring-blue-500" ' + (selectedLots.includes(num) ? 'checked' : '') + ' onchange="updateBasementMultiSelect(' + i + ', \'lots\', \'' + String(num).replace(/'/g, "\\'") + '\', this.checked)"><span>' + num + '</span></label>'; }).join('') || '<div class="p-2 text-slate-400 text-xs text-center">אין מגרשים</div>') + '</div></div>';
        
        let glHtml = '<div class="flex items-center justify-center gap-2 pt-1">' +
          '<input type="checkbox" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer" ' + (b.gl?'checked':'') + ' onchange="state.mdcBasements[' + i + '].gl=this.checked; saveLocalState();">' +
          '<input type="text" placeholder="ערך" class="w-16 border border-slate-200 outline-none rounded px-2 py-1 text-sm text-center" value="' + (b.glValue||'') + '" oninput="state.mdcBasements[' + i + '].glValue=this.value; saveLocalState();">' +
        '</div>';

        return '<tr class="align-top"><td class="p-3"><input type="text" placeholder="..." class="w-full border border-slate-200 outline-none rounded px-3 py-1.5 text-sm font-mono" value="' + (b.code||'') + '" oninput="state.mdcBasements[' + i + '].code=this.value; saveLocalState();"></td><td class="p-3"><input type="text" placeholder="..." class="w-full border border-slate-200 outline-none rounded px-3 py-1.5 text-sm" value="' + (b.desc||'') + '" oninput="state.mdcBasements[' + i + '].desc=this.value; saveLocalState();"></td><td class="p-3">' + bldgsHtml + '</td><td class="p-3"><input type="number" placeholder="..." class="w-full border border-slate-200 outline-none rounded px-3 py-1.5 text-sm" value="' + (b.floors||'') + '" oninput="state.mdcBasements[' + i + '].floors=this.value; saveLocalState();"></td><td class="p-3">' + lotsHtml + '</td><td class="p-3 text-center align-top w-28">' + glHtml + '</td><td class="p-3 text-center w-16 pt-4"><div onclick="state.mdcBasements.splice(' + i + ',1);renderBasements(); saveLocalState();">' + TRASH_ICON + '</div></td></tr>';
      }).join('');
      renderDecompositionRelationshipSummary();
    }
    
    function updateBasementMultiSelect(index, field, value, isChecked) {
      if (!state.mdcBasements[index]) return;
      let currentArr = state.mdcBasements[index][field] ? String(state.mdcBasements[index][field]).split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s; }) : [];
      if (isChecked) { if (!currentArr.includes(value)) currentArr.push(value); } else { currentArr = currentArr.filter(function(v) { return v !== value; }); }
      state.mdcBasements[index][field] = currentArr.join(', '); 
      saveLocalState();
      const textDiv = document.getElementById('text-multi-' + field + '-' + index); 
      if (textDiv) textDiv.innerHTML = generateChipsHtml(currentArr, field, index);
    }

    // ==========================================
    // VISUAL GROUPING SYSTEM & SUMMARY TABLE (STEP 2)
    // ==========================================
    let currentSelectedBuildings = [];
    let editingGroupId = null;
    let currentSelectedColor = 'c1';
    let currentDesignOptionModelId = null;

    const COLOR_MAP = {
        'c1': { main: '#00A5E3', bg: '#E5F6FC', border: '#B2E4F6', text: '#006E98' },
        'c2': { main: '#8DD7BF', bg: '#F3FBF8', border: '#E0F4EE', text: '#4C917B' },
        'c3': { main: '#FF96C5', bg: '#FFF4F9', border: '#FFD6E8', text: '#B34A79' },
        'c4': { main: '#FF5768', bg: '#FFF0F2', border: '#FFC2C9', text: '#B32A3B' },
        'c5': { main: '#FFBF65', bg: '#FFF9F0', border: '#FFE4C2', text: '#B37D22' },
        'c6': { main: '#FC6238', bg: '#FFF2EE', border: '#FED0C3', text: '#B03512' },
        'c7': { main: '#FFD872', bg: '#FFFBED', border: '#FFEDBC', text: '#A8841B' },
        'c8': { main: '#6C88C4', bg: '#F0F3F9', border: '#D3DDF0', text: '#3E578F' },
        'c9': { main: '#C05780', bg: '#F9EEF2', border: '#E7C8D4', text: '#803452' },
        'c10': { main: '#00B0BA', bg: '#E5F7F8', border: '#B2E7E9', text: '#00757C' },
        'c11': { main: '#00CDAC', bg: '#E5FAF6', border: '#B2F0E5', text: '#00856F' },
        'c12': { main: '#FF60A8', bg: '#FFF0F7', border: '#FFC2E0', text: '#B32D6A' },
        'c13': { main: '#CFF800', bg: '#FAFFE5', border: '#EEFCA8', text: '#6D8200' },
        'c14': { main: '#4DD091', bg: '#EDFAF4', border: '#C5F1DB', text: '#268759' },
        'c15': { main: '#74737A', bg: '#F1F1F1', border: '#D5D5D7', text: '#403F44' },
        'slate': { main: '#94a3b8', bg: '#f8fafc', border: '#e2e8f0', text: '#334155' }
    };

    function buildColorPicker() {
        const picker = document.getElementById('modal-color-picker');
        if (!picker) return;
        let html = '';
        
        let usedColors = [];
        if (state.siteGroups) {
            usedColors = state.siteGroups
                .filter(g => g.id !== editingGroupId)
                .map(g => g.color);
        }

        for (let key in COLOR_MAP) {
            if (key === 'slate') continue;
            if (usedColors.includes(key)) continue; 
            
            let c = COLOR_MAP[key];
            html += `<button type="button" onclick="selectGroupColor('${key}')" class="w-8 h-8 rounded-full transition group-color-btn relative cursor-pointer" data-color="${key}" style="background-color: ${c.main}; border: 2px solid white; outline: 2px solid transparent; outline-offset: 2px;"></button>`;
        }
        picker.innerHTML = html;
    }

    function renderGenModels() {
        const container = document.getElementById("visual-lots-container");
        if (!container) return;
        
        if (!state.siteGroups) state.siteGroups = [];
        
        let validBuildings = state.mdcBuildings.filter(b => b && b.name && b.name.trim() !== "");
        
        if (validBuildings.length === 0) {
            container.innerHTML = '<div class="col-span-full p-8 text-center text-slate-400 font-medium border border-dashed border-slate-300 rounded-xl">יש להגדיר תחילה מבנים בשלב 1.</div>';
            renderSummaryTable();
            return;
        }

        let lots = [...new Set(validBuildings.map(b => b.lot || 'Unassigned'))];

        let html = '';
        lots.forEach(lotNum => {
            let lotBldgs = validBuildings.filter(b => b.lot === lotNum || (!b.lot && lotNum === 'Unassigned'));
            let lotHeader = lotNum === 'Unassigned' ? 'Unassigned Lot' : `Lot ${lotNum}`;
            
            let cardsHtml = lotBldgs.map(b => {
                let bName = b.name.trim();
                let group = state.siteGroups.find(g => g.buildings.includes(bName));
                
                if (group) {
                    let colorKey = group.color;
                    if (!COLOR_MAP[colorKey]) {
                        const legacyMap = { 'purple': 'c8', 'blue': 'c1', 'teal': 'c10', 'yellow': 'c7', 'red': 'c4', 'emerald': 'c11', 'orange': 'c6', 'pink': 'c3', 'cyan': 'c10', 'indigo': 'c8' };
                        colorKey = legacyMap[colorKey] || 'c1';
                    }
                    let colors = COLOR_MAP[colorKey];

                    return `
                    <div class="relative flex flex-col justify-between p-3 rounded-lg border h-[90px] shadow-sm transition-all group-card" dir="rtl" style="background-color: ${colors.bg}; border-color: ${colors.border};">
                        <div class="flex justify-between items-start">
                            <span class="font-bold text-sm" style="color: ${colors.text};">מבנה ${bName}</span>
                            <div class="flex gap-2">
                                <button onclick="editGroup('${group.id}')" class="hover:opacity-70 transition" style="color: ${colors.text};"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                                <button onclick="deleteGroup('${group.id}')" class="text-slate-400 hover:text-red-500"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                            </div>
                        </div>
                        <div class="flex justify-between items-end mt-2">
                            <div class="flex flex-col">
                                <span class="text-[10px] font-bold opacity-70 uppercase tracking-wide" style="color: ${colors.text};">מודל:</span>
                                <span class="font-bold text-sm truncate max-w-[90px]" style="color: ${colors.text};" title="${group.name}">${group.name}</span>
                            </div>
                            <span class="bg-white px-2 py-0.5 rounded text-[10px] font-bold border" style="color: ${colors.text}; border-color: ${colors.border};">${group.type}</span>
                        </div>
                    </div>`;
                } else {
                    let isSelected = currentSelectedBuildings.includes(bName);
                    let borderClass = isSelected ? 'border-blue-400 bg-blue-50 ring-1 ring-blue-400' : 'border-slate-200 bg-white hover:border-blue-300';
                    return `
                    <label class="relative flex flex-col justify-between p-3 rounded-lg border ${borderClass} h-[90px] shadow-sm cursor-pointer transition-all" dir="rtl">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300" ${isSelected ? 'checked' : ''} onchange="toggleBuildingSelection('${bName}', this.checked, '${lotNum}')">
                            <span class="font-bold text-sm text-slate-800">מבנה ${bName}</span>
                        </div>
                        <span class="text-[11px] font-semibold text-slate-400 mt-2">מודל עצמאי</span>
                    </label>`;
                }
            }).join('');

            let lotGroups = state.siteGroups.filter(g => g.buildings.some(bName => lotBldgs.some(b => b.name.trim() === bName)));
            let lotColorKey = lotGroups.length > 0 ? lotGroups[0].color : 'c5'; 
            if (!COLOR_MAP[lotColorKey]) lotColorKey = 'c5';
            let bsColors = COLOR_MAP[lotColorKey];

            let lotFooter = `
            <div class="mt-4 border rounded-lg p-2 flex justify-between items-center px-4 transition-all" dir="rtl" style="background-color: ${bsColors.bg}; border-color: ${bsColors.border};">
                <span class="text-xs font-bold" style="color: ${bsColors.text};">${lotHeader} מרתף</span>
                <div class="flex items-center gap-2 text-[10px] font-bold" style="color: ${bsColors.text};">סימון: <span class="bg-white border px-1.5 py-0.5 rounded" style="border-color: ${bsColors.border}; color: ${bsColors.text};">BS</span></div>
            </div>`;

            html += `
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h4 class="font-bold text-lg text-slate-900">${lotHeader}</h4>
                        <span class="text-[10px] text-slate-400 font-medium">מבנים במגרש ${lotBldgs.length}</span>
                    </div>
                    <div class="w-2 h-2 rounded-full bg-blue-500"></div>
                </div>
                <div class="grid grid-cols-2 gap-3 flex-1">
                    ${cardsHtml}
                </div>
                ${lotFooter}
            </div>`;
        });

        container.innerHTML = html;
        updateFloatingActionBar();
        renderSummaryTable();
        renderDecompositionRelationshipSummary();
    }

    function getAllModelsForSummary() {
        if (!state.siteGroups) state.siteGroups = [];
        let models = [];
        let validBuildings = state.mdcBuildings.filter(b => b && b.name && b.name.trim() !== "");
        
        if (state.siteGroups) {
            state.siteGroups.forEach(g => {
                let firstBldg = validBuildings.find(b => b.name.trim() === g.buildings[0]);
                let lot = firstBldg ? firstBldg.lot || 'Unassigned' : 'Unassigned';
                models.push({
                    id: g.id,
                    isGroup: true,
                    lot: lot,
                    name: g.name,
                    type: g.type,
                    buildings: g.buildings,
                    color: g.color
                });
            });
        }

        let groupedBldgs = [];
        if(state.siteGroups) {
            state.siteGroups.forEach(g => groupedBldgs.push(...g.buildings));
        }
        validBuildings.forEach(b => {
            let bName = b.name.trim();
            if (!groupedBldgs.includes(bName)) {
                models.push({
                    id: 'standalone_' + bName,
                    isGroup: false,
                    lot: b.lot || 'Unassigned',
                    name: bName,
                    type: 'עצמאי',
                    buildings: [bName],
                    color: 'slate' 
                });
            }
        });
        
        return models;
    }

    function renderSummaryTable() {
        const tbody = document.getElementById("summary-table-body");
        const countSpan = document.getElementById("summary-total-models");
        if (!tbody || !countSpan) return;

        let models = getAllModelsForSummary();
        countSpan.innerText = models.length;

        if (models.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-400 font-medium">עדיין לא הוגדרו מודלים.</td></tr>';
            return;
        }

        tbody.innerHTML = models.map(m => {
            let lotText = m.lot === 'Unassigned' ? 'Unassigned Lot' : `Lot ${m.lot}`;
            
            let colorKey = m.color;
            if (!COLOR_MAP[colorKey]) {
                const legacyMap = { 'purple': 'c8', 'blue': 'c1', 'teal': 'c10', 'yellow': 'c7', 'red': 'c4', 'emerald': 'c11', 'orange': 'c6', 'pink': 'c3', 'cyan': 'c10', 'indigo': 'c8' };
                colorKey = legacyMap[colorKey] || 'slate';
            }
            let colorObj = COLOR_MAP[colorKey];
            
            let nameBadge = `<span class="px-3 py-1 rounded-full font-bold text-xs border" style="background-color: ${colorObj.bg}; color: ${colorObj.text}; border-color: ${colorObj.border};">${m.name}</span>`;
            let typeBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold border text-blue-600 bg-blue-50 border-blue-200">${m.type}</span>`;
            
            let bldgsText = m.buildings.map(b => `מבנה ${b}`).join(', ');

            let optionsForModel = (state.designOptions || []).filter(d => d.modelId === m.id);
            let designOptCell = '';

            if (optionsForModel.length > 0) {
                let pillsHtml = optionsForModel.map((opt, idx) => `
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-white text-slate-700 border border-slate-200 shadow-sm" dir="ltr">
                        <span class="pr-2 border-r border-slate-200">${opt.title}</span>
                        <span class="text-purple-600 font-mono pl-2">#${idx+1}</span>
                    </span>
                `).join(' ');

                designOptCell = `
                <div class="flex items-center justify-center gap-2">
                    <span class="text-[10px] font-bold text-purple-600 bg-purple-50 border border-purple-200 px-2 py-1 rounded-md" dir="rtl">${optionsForModel.length} הערות</span>
                    ${pillsHtml}
                    <button onclick="openDesignOptionModal('${m.id}')" class="w-7 h-7 rounded-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-bold text-sm flex items-center justify-center shadow-sm transition" title="הוספה וניהול של Design Options">+</button>
                </div>`;
            } else {
                designOptCell = `
                <div class="flex justify-center">
                    <button onclick="openDesignOptionModal('${m.id}')" class="text-xs font-semibold text-blue-600 border border-blue-200 bg-white hover:bg-blue-50 px-3 py-1.5 rounded-full transition shadow-sm">
                        + add design option
                    </button>
                </div>`;
            }

            return `
            <tr class="hover:bg-slate-50 transition border-b border-slate-100 last:border-0">
                <td class="py-3 px-4 text-slate-700 font-medium">${lotText}</td>
                <td class="py-3 px-4">${nameBadge}</td>
                <td class="py-3 px-4">${typeBadge}</td>
                <td class="py-3 px-4 text-slate-600 font-medium" dir="rtl">${bldgsText}</td>
                <td class="py-3 px-4 text-center">${designOptCell}</td>
            </tr>`;
        }).join('');
    }

    // --- DESIGN OPTIONS MODAL LOGIC ---

    function openDesignOptionModal(modelId) {
        currentDesignOptionModelId = modelId;
        const modal = document.getElementById('modal-design-options');
        const titleEl = document.getElementById('do-modal-title');
        const targetRadiosContainer = document.getElementById('do-target-radios');
        
        let allModels = getAllModelsForSummary();
        let targetModel = allModels.find(m => m.id === modelId);
        if (!targetModel) return;

        titleEl.innerText = `Design Options : "${targetModel.name}"`;
        
        document.getElementById('do-input-title').value = '';
        document.getElementById('do-input-desc').value = '';

        let radioHtml = `<label class="flex items-center gap-2 border border-slate-200 rounded-lg p-2 cursor-pointer hover:bg-white transition bg-slate-50 shadow-sm">
            <input type="radio" name="do-target" value="MODEL_${targetModel.name}" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500">
            <span class="text-xs font-bold text-slate-700">מודל (${targetModel.name})</span>
        </label>`;

        if (targetModel.isGroup && targetModel.buildings.length > 1) {
            targetModel.buildings.forEach(b => {
                radioHtml += `<label class="flex items-center gap-2 border border-slate-200 rounded-lg p-2 cursor-pointer hover:bg-white transition bg-slate-50 shadow-sm">
                    <input type="radio" name="do-target" value="BLDG_${b}" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                    <span class="text-xs font-bold text-slate-700">${b}</span>
                </label>`;
            });
        }
        targetRadiosContainer.innerHTML = radioHtml;

        renderExistingDesignOptions();
        modal.classList.remove('hidden');
    }

    function closeDesignOptionModal() {
        document.getElementById('modal-design-options').classList.add('hidden');
        currentDesignOptionModelId = null;
    }

    function addDesignOption() {
        if (!state.designOptions) state.designOptions = [];
        
        const title = document.getElementById('do-input-title').value.trim();
        const desc = document.getElementById('do-input-desc').value.trim();
        const targetVal = getRadioValue('do-target'); 
        
        if (!title) {
            showToast('אנא הזן כותרת לעיצוב', 'error');
            return;
        }

        let isGroupTarget = targetVal.startsWith('MODEL_');
        let targetCode = isGroupTarget ? targetVal.replace('MODEL_', '') : targetVal.replace('BLDG_', '');

        state.designOptions.push({
            id: 'do_' + Date.now(),
            modelId: currentDesignOptionModelId,
            targetCode: targetCode,
            isGroupTarget: isGroupTarget,
            title: title,
            desc: desc
        });

        syncDesignOptionsToLegacy();
        saveLocalState();
        
        document.getElementById('do-input-title').value = '';
        document.getElementById('do-input-desc').value = '';
        renderExistingDesignOptions();
        renderSummaryTable();
        showToast('הערת עיצוב נוספה בהצלחה', 'success');
    }

    function removeDesignOption(doId) {
        state.designOptions = state.designOptions.filter(d => d.id !== doId);
        syncDesignOptionsToLegacy();
        saveLocalState();
        renderExistingDesignOptions();
        renderSummaryTable();
    }

    function renderExistingDesignOptions() {
        const listContainer = document.getElementById('do-existing-list');
        if (!state.designOptions) state.designOptions = [];
        
        let existing = state.designOptions.filter(d => d.modelId === currentDesignOptionModelId);

        if (existing.length === 0) {
            listContainer.innerHTML = '<div class="text-xs text-slate-400 italic">לא קיימות הערות עיצוב למודל זה</div>';
            return;
        }

        listContainer.innerHTML = existing.map((d, idx) => {
            let targetLabel = d.isGroupTarget ? 'המודל' : `מבנה ${d.targetCode}`;
            return `
            <div class="bg-white border border-slate-200 rounded-xl p-3.5 relative shadow-sm text-right" dir="rtl">
                <div class="flex items-start justify-between">
                    <div class="flex items-center gap-2">
                        <span class="bg-purple-100 text-purple-700 font-bold text-xs px-2 py-0.5 rounded-md font-mono">#${idx+1}</span>
                        <h5 class="text-xs font-bold text-slate-800">${d.title}</h5>
                        <span class="bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded-md border border-slate-200">${targetLabel}</span>
                    </div>
                    <button onclick="removeDesignOption('${d.id}')" class="text-slate-400 hover:text-red-500 transition p-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
                ${d.desc ? `<p class="text-xs text-slate-500 mt-2 pr-1 font-medium">${d.desc}</p>` : ''}
            </div>`;
        }).join('');
    }

    function toggleBuildingSelection(bName, isChecked, lotNum) {
        if (isChecked) {
            if (!currentSelectedBuildings.includes(bName)) currentSelectedBuildings.push(bName);
        } else {
            currentSelectedBuildings = currentSelectedBuildings.filter(name => name !== bName);
        }
        renderGenModels();
    }

    function clearBuildingSelection() {
        currentSelectedBuildings = [];
        renderGenModels();
    }

    function updateFloatingActionBar() {
        const bar = document.getElementById('floating-action-bar');
        const count = document.getElementById('floating-selected-count');
        const btn = document.getElementById('btn-unify-models');
        
        if (currentSelectedBuildings.length > 0) {
            bar.classList.remove('hidden');
            count.innerText = `${currentSelectedBuildings.length} מבנים נבחרו`;
            if (currentSelectedBuildings.length >= 2) {
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.disabled = false;
            } else {
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.disabled = true;
            }
        } else {
            bar.classList.add('hidden');
        }
    }

    function openGroupModal() {
        if (currentSelectedBuildings.length < 2 && !editingGroupId) return;
        
        const modal = document.getElementById('modal-group-buildings');
        const displayDiv = document.getElementById('modal-selected-buildings');
        const nameInput = document.getElementById('modal-group-name');
        
        buildColorPicker(); 

        let buildingsToDisplay = currentSelectedBuildings;
        
        if (editingGroupId) {
            let group = state.siteGroups.find(g => g.id === editingGroupId);
            if (group) {
                buildingsToDisplay = group.buildings;
                nameInput.value = group.name;
                setRadioValue('modal-group-type', group.type);
                selectGroupColor(group.color);
            }
        } else {
            nameInput.value = '';
            setRadioValue('modal-group-type', 'טיפוסי');
            
            let usedColors = state.siteGroups ? state.siteGroups.map(g => g.color) : [];
            let firstAvail = 'c1';
            for (let key in COLOR_MAP) {
                if (key !== 'slate' && !usedColors.includes(key)) {
                    firstAvail = key;
                    break;
                }
            }
            selectGroupColor(firstAvail);
        }

        displayDiv.innerHTML = buildingsToDisplay.map(b => {
            let lot = state.mdcBuildings.find(bd => bd.name.trim() === b)?.lot || 'N/A';
            return `<span class="bg-blue-50 text-blue-700 border border-blue-200 text-xs px-2.5 py-1 rounded-full font-bold">מבנה ${b} (מגרש ${lot})</span>`;
        }).join('');

        modal.classList.remove('hidden');
    }

    function closeGroupModal() {
        document.getElementById('modal-group-buildings').classList.add('hidden');
        editingGroupId = null;
    }

    function selectGroupColor(colorCode) {
        currentSelectedColor = colorCode;
        document.querySelectorAll('.group-color-btn').forEach(btn => {
            if (btn.getAttribute('data-color') === colorCode) {
                btn.style.outlineColor = COLOR_MAP[colorCode].main;
                btn.innerHTML = `<svg class="w-5 h-5 text-white absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            } else {
                btn.style.outlineColor = 'transparent';
                btn.innerHTML = '';
            }
        });
    }

    function saveBuildingGroup() {
        const nameInput = document.getElementById('modal-group-name').value.trim();
        const type = getRadioValue('modal-group-type');
        
        if (!nameInput) {
            showToast('אנא הזן שם מודל', 'error');
            return;
        }

        if (!state.siteGroups) state.siteGroups = [];

        if (editingGroupId) {
            let group = state.siteGroups.find(g => g.id === editingGroupId);
            if (group) {
                group.name = nameInput;
                group.type = type;
                group.color = currentSelectedColor;
            }
        } else {
            state.siteGroups.push({
                id: 'grp_' + Date.now(),
                name: nameInput,
                type: type,
                color: currentSelectedColor,
                buildings: [...currentSelectedBuildings]
            });
        }
        
        syncSiteGroupsToLegacy();
        saveLocalState();
        closeGroupModal();
        clearBuildingSelection(); 
        showToast('המודל נשמר בהצלחה', 'success');
    }

    function editGroup(id) {
        editingGroupId = id;
        openGroupModal();
    }

    function deleteGroup(id) {
        if (confirm('האם אתה בטוח שברצונך לפרק קבוצה זו?')) {
            state.siteGroups = state.siteGroups.filter(g => g.id !== id);
            syncSiteGroupsToLegacy();
            saveLocalState();
            renderGenModels();
        }
    }

    function syncSiteGroupsToLegacy() {
        state.mdcGenModels = [];
        let validBuildings = state.mdcBuildings.filter(b => b && b.name && b.name.trim() !== "");
        
        state.siteGroups.forEach(g => {
            if(g.buildings.length > 0) {
                let firstLot = validBuildings.find(b => b.name.trim() === g.buildings[0])?.lot || '';
                state.mdcGenModels.push({
                    lot: firstLot,
                    type: 'Building',
                    name: g.buildings[0], 
                    siteLoc: true,
                    siteBldgs: g.buildings.slice(1),
                    customSiteName: g.name,
                    groupColor: g.color,
                    groupType: g.type,
                    desOpt: false,
                    desOptName: '',
                    desOptDesc: ''
                });
            }
        });
        syncDesignOptionsToLegacy();
    }

    function syncDesignOptionsToLegacy() {
        if (!state.designOptions) return;
        let validBuildings = state.mdcBuildings.filter(b => b && b.name && b.name.trim() !== "");
        
        state.mdcGenModels.forEach(m => {
            let relevantOptions = state.designOptions.filter(d => 
                (d.isGroupTarget && d.targetCode === m.customSiteName) ||
                (!d.isGroupTarget && d.targetCode === m.name)
            );
            
            if (relevantOptions.length > 0) {
                m.desOpt = true;
                m.desOptName = relevantOptions.map(o => o.title).join(' | ');
                m.desOptDesc = relevantOptions.map(o => o.desc).join(' | ');
            } else {
                m.desOpt = false;
                m.desOptName = '';
                m.desOptDesc = '';
            }
        });
        
        validBuildings.forEach(b => {
            let bName = b.name.trim();
            let isGrouped = state.siteGroups.some(g => g.buildings.includes(bName));
            if (!isGrouped) {
                let relevantOptions = state.designOptions.filter(d => d.targetCode === bName);
                if (relevantOptions.length > 0) {
                    let existingGen = state.mdcGenModels.find(m => m.name === bName);
                    if (existingGen) {
                        existingGen.desOpt = true;
                        existingGen.desOptName = relevantOptions.map(o => o.title).join(' | ');
                        existingGen.desOptDesc = relevantOptions.map(o => o.desc).join(' | ');
                    } else {
                        state.mdcGenModels.push({
                            lot: b.lot || 'Unassigned',
                            type: 'Building',
                            name: bName,
                            siteLoc: false,
                            siteBldgs: [],
                            customSiteName: '',
                            desOpt: true,
                            desOptName: relevantOptions.map(o => o.title).join(' | '),
                            desOptDesc: relevantOptions.map(o => o.desc).join(' | ')
                        });
                    }
                }
            }
        });
    }

    function renderDisciplines() {
        if (!state.mdcDisciplines) state.mdcDisciplines = [];
        
        state.mdcDisciplines = state.mdcDisciplines.filter(d => d && (d.he || d.ac)).map(d => {
            let discCode = d.ac || d.code || "";
            let discHe = d.he || d.name || "";
            let masterMatch = state.allAvailableDisciplines ? state.allAvailableDisciplines.find(x => x.ac === discCode || x.he === discHe) : null;
            
            if (masterMatch) {
                if (!discHe) discHe = masterMatch.he;
                if (!discCode) discCode = masterMatch.ac;
            }
            
            let platformVal = d.platform || (masterMatch ? masterMatch.platform : "Revit");
            let scopeVal = (masterMatch && masterMatch.scope) ? masterMatch.scope : (d.scope || "Building");
            let orgCodeVal = d.orgCode !== undefined ? d.orgCode : (d.ac ? d.ac : "");

            return {
                ac: discCode,
                he: discHe || discCode,
                orgCode: orgCodeVal,
                platform: platformVal,
                scope: scopeVal,
                checked: d.checked !== false
            };
        });

        const tbody = document.getElementById("tbl-disciplines-body");
        const countSpan = document.getElementById("disciplines-count");
        if (countSpan) countSpan.innerText = state.mdcDisciplines.length;

        if (!tbody) return;

        if (state.mdcDisciplines.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-slate-400 font-medium">אין דיסציפלינות נבחרות. בחר מתוך התפריט למעלה.</td></tr>';
            return;
        }

        tbody.innerHTML = state.mdcDisciplines.map((d, i) => {
            let platformColor = "bg-blue-50 text-blue-600 border-blue-200";
            let pLower = (d.platform || "").toLowerCase();
            if (pLower.includes("civil")) platformColor = "bg-purple-50 text-purple-600 border-purple-200";
            else if (pLower.includes("navis")) platformColor = "bg-emerald-50 text-emerald-600 border-emerald-200";
            else if (pLower.includes("autocad") || pLower.includes("cad")) platformColor = "bg-amber-50 text-amber-600 border-amber-200";

            return `
            <tr class="hover:bg-slate-50/80 transition align-middle">
                <td class="py-3 px-3 text-center text-slate-400 font-bold text-xs">${i + 1}</td>
                <td class="py-3 px-4 font-bold text-slate-800 text-sm">${d.he}</td>
                <td class="py-3 px-4 text-center">
                    <span class="bg-blue-50 text-blue-700 font-mono font-bold text-xs px-2.5 py-1 rounded-md border border-blue-200 inline-block">${d.ac}</span>
                </td>
                <td class="py-3 px-4 text-center">
                    <input type="text" class="w-40 border border-slate-200 rounded-lg px-3 py-1 text-xs font-mono font-bold text-slate-800 text-center focus:ring-2 focus:ring-blue-500 outline-none transition bg-white shadow-sm" value="${d.orgCode || ''}" placeholder="קוד ארגוני..." oninput="state.mdcDisciplines[${i}].orgCode = this.value; saveLocalState();">
                </td>
                <td class="py-3 px-4 text-center">
                    <span class="px-3 py-1 rounded-full text-xs font-bold border ${platformColor} inline-block">${d.platform || 'Revit'}</span>
                </td>
                <td class="py-3 px-4 text-center">
                    <span class="bg-slate-100 text-slate-700 font-semibold text-xs px-3 py-1 rounded-lg border border-slate-200 inline-block">${d.scope || 'Building'}</span>
                </td>
                <td class="py-3 px-3 text-center">
                    <button type="button" onclick="removeDiscipline(${i})" class="text-slate-300 hover:text-red-500 transition p-1" title="הסרת תחום">
                        <svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </td>
            </tr>`;
        }).join('');

        const select = document.getElementById("inline-discipline-select");
        if (!select) return;
        let html = '<option value="">+ הוספת תחום</option>';
        const addedNames = state.mdcDisciplines.map(d => d.he);
        let available = (state.allAvailableDisciplines || []).filter(d => !addedNames.includes(d.he));
        
        const priorityOrder = [
            "אדריכל",
            "קונסטרוקטור",
            "יועץ חשמל",
            "יועץ אינסטלציה",
            "יועץ מ\"א",
            "אדריכל נוף",
            "יועץ בטיחות אש",
            "תיאום מערכות",
            "ניהול מודל",
            "United Reference System"
        ];

        available.sort((a, b) => {
            let nameA = (a.he || "").trim();
            let nameB = (b.he || "").trim();
            
            let indexA = priorityOrder.indexOf(nameA);
            let indexB = priorityOrder.indexOf(nameB);

            if (indexA === -1) indexA = 999;
            if (indexB === -1) indexB = 999;

            if (indexA !== indexB) {
                return indexA - indexB;
            }

            return nameA.localeCompare(nameB, 'he');
        });

        available.forEach(d => { 
            let safeVal = (d.he || "").replace(/"/g, '&quot;');
            html += '<option value="' + safeVal + '">' + d.he + '</option>'; 
        });
        
        select.innerHTML = html;
        select.value = "";
    }

    function addDisciplineFromDropdown() {
        const select = document.getElementById("inline-discipline-select");
        const val = select.value;
        if (!val) return;
        
        const decodedVal = val.replace(/&quot;/g, '"');
        const discObj = state.allAvailableDisciplines.find(d => d.he === decodedVal);
        
        if (discObj) {
            state.mdcDisciplines.push({
                he: discObj.he,
                ac: discObj.ac,
                orgCode: discObj.ac || "",
                platform: discObj.platform || "Revit",
                scope: discObj.scope || "Building",
                checked: true
            });
            saveLocalState();
            renderDisciplines();
        }
    }

    function removeDiscipline(index) { state.mdcDisciplines.splice(index, 1); saveLocalState(); renderDisciplines(); }

    // ==========================================
    // COLUMN VISIBILITY & ORDER LOGIC
    // ==========================================
    const DEFAULT_COL_ORDER = ['code', 'projectCode', 'discCode', 'bldgCode', 'lotCode', 'desc', 'comment'];

    function getColOrder() {
        if (state.colOrder && state.colOrder.length > 0) return state.colOrder;
        let projNo = state.selectedProject ? state.selectedProject.no : 'default';
        let saved = safeGetLocal('bim_col_order_' + projNo);
        if (saved && Array.isArray(saved) && saved.length > 0) {
            return saved;
        }
        return [...DEFAULT_COL_ORDER];
    }

    function setColOrder(newOrder) {
        state.colOrder = newOrder;
        if (state.selectedProject) {
            safeSetLocal('bim_col_order_' + state.selectedProject.no, JSON.stringify(state.colOrder));
        }
    }

    function getColVis() {
        if (state.colVis) return state.colVis;
        let projNo = state.selectedProject ? state.selectedProject.no : 'default';
        let saved = safeGetLocal('bim_col_vis_' + projNo);
        if (saved && Object.keys(saved).length > 0) return saved;
        return { code: true, projectCode: true, discCode: true, bldgCode: true, lotCode: true, desc: true, comment: true };
    }

    function toggleColumnVis(col, isVisible) {
        state.colVis = getColVis();
        state.colVis[col] = isVisible;
        if (state.selectedProject) {
            safeSetLocal('bim_col_vis_' + state.selectedProject.no, JSON.stringify(state.colVis));
        }
        renderFinalModelTable();
    }

    // --- COLUMN DRAG AND DROP ---
    let dragColId = null;
    function handleColDragStart(e, col) {
        dragColId = col;
        e.dataTransfer.effectAllowed = 'move';
        e.target.classList.add('opacity-50');
    }
    function handleColDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        return false;
    }
    function handleColDrop(e, targetCol) {
        e.stopPropagation();
        if (dragColId && dragColId !== targetCol) {
            let order = getColOrder();
            let srcIndex = order.indexOf(dragColId);
            let targetIndex = order.indexOf(targetCol);
            if (srcIndex > -1 && targetIndex > -1) {
                let moved = order.splice(srcIndex, 1)[0];
                order.splice(targetIndex, 0, moved);
                setColOrder(order);
                saveLocalState();
                renderFinalModelTable();
            }
        }
        return false;
    }
    function handleColDragEnd(e) {
        e.target.classList.remove('opacity-50');
        dragColId = null;
    }

    // --- ROW DRAG AND DROP ---
    let dragSrcId = null;
    function handleRowDragStart(e, id) { dragSrcId = id; e.dataTransfer.effectAllowed = 'move'; e.currentTarget.classList.add('opacity-50'); }
    function handleRowDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; return false; }
    function handleRowDrop(e, targetId) {
        e.stopPropagation();
        if (dragSrcId !== targetId) {
            let models = buildModelsArray();
            let srcIndex = models.findIndex(m => m.id === dragSrcId);
            let targetIndex = models.findIndex(m => m.id === targetId);
            
            if(srcIndex > -1 && targetIndex > -1) {
                let movedItem = models.splice(srcIndex, 1)[0];
                models.splice(targetIndex, 0, movedItem);
                state.modelOrder = models.map(m => m.id);
                state.modelOrderDirty = true;
                markModelsDirty(false);
                saveLocalState(); renderFinalModelTable();
            }
        }
        return false;
    }
    function handleRowDragEnd(e) { e.currentTarget.classList.remove('opacity-50'); dragSrcId = null;}


    function generateBaseCode(prefix, discCode, displayCode, parsedLot, floorStr) {
        let parts = [];
        if (prefix) parts.push(prefix);
        if (discCode) parts.push(discCode);
        if (displayCode) {
            parts.push(displayCode);
            if (floorStr) parts.push(floorStr);
        }
        if (parsedLot) parts.push(parsedLot);
        
        if (parts.length === 0) return 'UNNAMED-MODEL';
        return parts.join('-');
    }

    function buildModelsArray() {
        const proj = state.selectedProject;
        if (!proj) return [];
        if (!state.modelOverrides) state.modelOverrides = {};
        if (!state.addedModels) state.addedModels = [];
        if (!state.deletedModels) state.deletedModels = [];
        if (!state.modelOrder) state.modelOrder = [];

        if (Array.isArray(state.sourceModels) && state.regenerateModels !== true) {
            let preserved = state.sourceModels.map(function(source, index) {
                source = source || {};
                const code = String(source.code || source.id || '');
                return Object.assign({}, source, {
                    id: String(source.id || code || ('source_' + index)),
                    code: code,
                    projectCode: source.projectCode || '',
                    discCode: source.discCode || '',
                    bldgCode: source.bldgCode || '',
                    lotCode: source.lotCode || '',
                    desc: source.desc || '',
                    comment: source.comment || ''
                });
            }).filter(function(model) { return !state.deletedModels.includes(model.id); });
            preserved = preserved.map(function(model) {
                const override = state.modelOverrides[model.id];
                return override ? Object.assign({}, model, override) : model;
            });
            preserved = preserved.concat(state.addedModels);
            if (state.modelOrderDirty && state.modelOrder.length) {
                const order = state.modelOrder;
                preserved.sort(function(a, b) {
                    const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
                    if (ai < 0 && bi < 0) return 0;
                    if (ai < 0) return 1;
                    if (bi < 0) return -1;
                    return ai - bi;
                });
            }
            return preserved;
        }
        
        let models = []; 
        const prefix = state.bimInfo.code ? state.bimInfo.code : proj.no;
        const activeDisciplines = (state.mdcDisciplines || []).filter(function(d) { return d && d.checked !== false; }); 

        let consumedBldgs = [];
        (state.mdcGenModels || []).forEach(function(m) {
            if (m && m.siteLoc && m.siteBldgs) {
                consumedBldgs = consumedBldgs.concat(m.siteBldgs);
            }
        });

        let allBldgs = [];
        let validBuildings = (state.mdcBuildings || []).filter(b => b && b.name && b.name.trim() !== "");
        validBuildings.forEach(function(b) { allBldgs.push({ code: b.name.trim(), desc: b.desc || b.name.trim(), lot: b.lot || "", floors: parseInt(b.floors) || 1, isBasement: false }); });
        (state.mdcBasements || []).forEach(function(b) { 
            if (b && b.code && b.code.trim() !== "") {
                allBldgs.push({ code: b.code.trim(), desc: b.desc || b.code.trim(), lot: b.lots || "", floors: parseInt(b.floors) || 1, isBasement: true }); 
            }
        });

        allBldgs = allBldgs.filter(function(b) { return !consumedBldgs.includes(b.code); });

        activeDisciplines.forEach(function(disc) {
            let discCode = (disc.ac || "").trim().toUpperCase(); 
            let discHe = (disc.he || "").trim();
            
            let masterMatch = state.allAvailableDisciplines ? state.allAvailableDisciplines.find(function(d) { 
                return (d.ac || "").trim().toUpperCase() === discCode || (d.he || "").trim() === discHe; 
            }) : null;
            
            let scopeRaw = (masterMatch && masterMatch.scope ? masterMatch.scope : (disc.scope || "Building")).toString().trim().toLowerCase();

            let isProjectScope = ['project', 'פרויקט'].includes(scopeRaw);
            let isLotScope = ['lot', 'מגרש'].includes(scopeRaw);
            let isBuildingScope = ['building', 'בניין', 'מבנה'].includes(scopeRaw);
            let isFloorScope = ['floor', 'floors', 'קומה', 'קומות'].includes(scopeRaw);

            const forceProjectDiscs = ['URS', 'BIM', 'SP', 'SO', 'SF'];
            const forceLotDiscs = ['LS'];

            if (forceProjectDiscs.includes(discCode)) {
                isProjectScope = true; isLotScope = false; isBuildingScope = false; isFloorScope = false;
            } else if (forceLotDiscs.includes(discCode)) {
                isLotScope = true; isProjectScope = false; isBuildingScope = false; isFloorScope = false;
            } else if (!isProjectScope && !isLotScope && !isBuildingScope && !isFloorScope) {
                isBuildingScope = true; 
            }

            if (isProjectScope) {
                let baseCode = generateBaseCode(prefix, discCode, "", "", "");
                models.push({ id: baseCode, code: baseCode, desc: discHe, comment: "", discCode: discCode, projectCode: prefix, bldgCode: "", lotCode: "", isCustom: false, isBasement: false });
            }
            else if (isLotScope) {
                (state.mdcLots || []).forEach(function(lot) {
                    let lotNum = lot.number ? String(lot.number).trim() : "";
                    if (!lotNum || lotNum === "Unassigned") return;
                    let baseCode = generateBaseCode(prefix, discCode, "", lotNum, "");
                    models.push({ id: baseCode, code: baseCode, desc: discHe + " - מגרש " + lotNum, comment: "", discCode: discCode, projectCode: prefix, bldgCode: "", lotCode: lotNum, isCustom: false, isBasement: false });
                });
            }
            else if (isBuildingScope || isFloorScope) {
                allBldgs.forEach(function(bldg) {
                    let bCode = bldg.code; let bDesc = bldg.desc; let lotNum = bldg.lot; let floors = bldg.floors;
                    if (!bCode) return;

                    let targetCode = bCode; let displayCode = bCode; let isSite = false;
                    let siteBldgsList = []; let customName = "";
                    let allBldgsForSite = [bCode]; 

                    let genMatch = (state.mdcGenModels || []).find(function(m) { return m && m.name === bCode; });
                    if (genMatch && genMatch.siteLoc) {
                        customName = genMatch.customSiteName || "";
                        siteBldgsList = genMatch.siteBldgs || [];
                        allBldgsForSite = [bCode].concat(siteBldgsList);
                        targetCode = allBldgsForSite.join("-");
                        displayCode = customName || targetCode;
                        isSite = true;
                    }

                    let siteBldgsStr = allBldgsForSite.join("+"); 
                    let parsedLot = (lotNum && lotNum !== 'Unassigned' && lotNum !== '') ? lotNum.split(',')[0].trim() : '';
                    
                    if (isBuildingScope) {
                        let baseCode = generateBaseCode(prefix, discCode, displayCode, parsedLot, "");

                        let defaultDesc = (bDesc + " " + discHe).trim();
                        let defaultComment = "";

                        if (isSite) {
                            if (customName) {
                                defaultDesc = "מודל טיפוס \u200E" + customName + "\u200E עבור בניינים \u200E" + siteBldgsStr + "\u200E עבור מודל " + discHe;
                                defaultComment = "מודל מבוצע ע\"י SITE לבניינים " + siteBldgsStr + " אשר נקרא " + customName;
                            } else {
                                defaultDesc = "מודל טיפוס עבור בניינים \u200E" + siteBldgsStr + "\u200E עבור מודל " + discHe;
                                defaultComment = "קיימים SITES במודל זה עבור בניינים " + siteBldgsStr;
                            }
                        }
                        models.push({ id: baseCode, code: baseCode, desc: defaultDesc, comment: defaultComment, discCode: discCode, projectCode: prefix, bldgCode: displayCode, lotCode: parsedLot, isCustom: false, isBasement: bldg.isBasement });
                    } 
                    else if (isFloorScope) {
                        for (let f = 1; f <= floors; f++) {
                            let floorStr = f < 10 ? "0" + f : String(f);
                            let baseCode = generateBaseCode(prefix, discCode, displayCode, parsedLot, floorStr);

                            let defaultDesc = (bDesc + " " + discHe + " קומה " + floorStr).trim();
                            let defaultComment = "";
                            
                            if (isSite) {
                                if (customName) {
                                    defaultDesc = "מודל טיפוס \u200E" + customName + "\u200E עבור בניינים \u200E" + siteBldgsStr + "\u200E עבור מודל " + discHe + " קומה " + floorStr;
                                    defaultComment = "מודל מבוצע ע\"י SITE לבניינים " + siteBldgsStr + " אשר נקרא " + customName;
                                } else {
                                    defaultDesc = "מודל טיפוס עבור בניינים \u200E" + siteBldgsStr + "\u200E עבור מודל " + discHe + " קומה " + floorStr;
                                    defaultComment = "קיימים SITES במודל זה עבור בניינים " + siteBldgsStr;
                                }
                            }
                            models.push({ id: baseCode, code: baseCode, desc: defaultDesc, comment: defaultComment, discCode: discCode, projectCode: prefix, bldgCode: displayCode, lotCode: parsedLot, isCustom: false, isBasement: bldg.isBasement });
                        }
                    }
                });
            }
        });

        models = models.filter(m => m && !state.deletedModels.includes(m.id));
        models = models.concat(state.addedModels || []);

        models = models.map(m => {
            if (m && state.modelOverrides[m.id]) {
                let o = state.modelOverrides[m.id];
                return {
                    ...m,
                    code: o.code !== undefined ? o.code : m.code,
                    desc: o.desc !== undefined ? o.desc : m.desc,
                    comment: o.comment !== undefined ? o.comment : m.comment,
                    discCode: o.discCode !== undefined ? o.discCode : m.discCode,
                    projectCode: o.projectCode !== undefined ? o.projectCode : m.projectCode,
                    bldgCode: o.bldgCode !== undefined ? o.bldgCode : m.bldgCode,
                    lotCode: o.lotCode !== undefined ? o.lotCode : m.lotCode
                };
            }
            return m;
        });

        models.sort(function(a, b) {
            if (!a) return 1;
            if (!b) return -1;
            
            const bottomDisciplines = ['URS', 'SP', 'BIM'];
            let codeA = (a.discCode || "").trim().toUpperCase();
            let codeB = (b.discCode || "").trim().toUpperCase();
            
            let aIsBottom = bottomDisciplines.includes(codeA);
            let bIsBottom = bottomDisciplines.includes(codeB);
            
            if (aIsBottom && !bIsBottom) return 1;
            if (!aIsBottom && bIsBottom) return -1;
            
            if (aIsBottom && bIsBottom) {
                return bottomDisciplines.indexOf(codeA) - bottomDisciplines.indexOf(codeB);
            }

            if (state.modelOrder && state.modelOrder.length > 0) {
                let idxA = state.modelOrder.indexOf(a.id);
                let idxB = state.modelOrder.indexOf(b.id);
                if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                if (idxA !== -1) return -1;
                if (idxB !== -1) return 1;
            }
            
            const disciplineOrder = ['AR', 'EL', 'ME', 'PL', 'ST', 'LS', 'SO'];
            let indexA = disciplineOrder.indexOf(codeA); 
            let indexB = disciplineOrder.indexOf(codeB);
            if(indexA === -1) indexA = 999; 
            if(indexB === -1) indexB = 999;
            
            if (indexA !== indexB) return indexA - indexB; 
            
            let aCode = a.code ? String(a.code) : "";
            let bCode = b.code ? String(b.code) : "";

            let aIsBS = (aCode.indexOf('-BS-') > -1 || aCode.indexOf('-BS') > -1);
            let bIsBS = (bCode.indexOf('-BS-') > -1 || bCode.indexOf('-BS') > -1);

            if (aIsBS && !bIsBS) return 1; 
            if (!aIsBS && bIsBS) return -1;
            
            return aCode.localeCompare(bCode);
        });

        if (!state.modelOrder || state.modelOrder.length === 0) {
            state.modelOrder = models.map(m => m ? m.id : "");
        }
        
        return models;
    }

    function updateModelOverrideAndSync(id, field, value, oldValue, inputElement) {
        markModelsDirty(false);
        if (!state.modelOverrides) state.modelOverrides = {};
        if (!state.modelOverrides[id]) state.modelOverrides[id] = {};
        state.modelOverrides[id][field] = value;

        if (field === 'code') {
            let customModel = state.addedModels.find(m => m.id === id);
            if(customModel) { customModel.code = value; }
            if (typeof markPilotMatchEdited === 'function') markPilotMatchEdited(inputElement, value);
        }

        if (value.trim() !== '' && value !== oldValue) {
            if (field === 'discCode') {
                let existing = state.mdcDisciplines.find(d => d.ac === oldValue || d.he === oldValue);
                if (existing) {
                    existing.ac = value;
                    existing.he = value;
                } else {
                    let exists = state.mdcDisciplines.some(d => d.ac === value || d.he === value);
                    if (!exists) state.mdcDisciplines.push({ ac: value, he: value, orgCode: value, platform: "Revit", scope: "Building", checked: true });
                }
                renderDisciplines();
            }
            else if (field === 'lotCode') {
                let existing = state.mdcLots.find(l => l.number === oldValue);
                if (existing) {
                    existing.number = value;
                    state.mdcBuildings.forEach(b => { if (b.lot === oldValue) b.lot = value; });
                } else {
                    let exists = state.mdcLots.some(l => l.number === value);
                    if (!exists) state.mdcLots.push({ number: value });
                }
                renderLots(); renderBuildings(); renderBasements();
            }
            else if (field === 'bldgCode') {
                let existing = state.mdcBuildings.find(b => b.name === oldValue);
                if (existing) {
                    existing.name = value;
                } else {
                    let exists = state.mdcBuildings.some(b => b.name === value) || state.mdcBasements.some(b => b.code === value);
                    if (!exists) state.mdcBuildings.push({ name: value, desc: value, floors: 1, lot: "", gl: false, glValue: "" });
                }
                renderBuildings();
            }
            else if (field === 'projectCode') {
                state.bimInfo.code = value;
                let el = document.getElementById("info-prj-code");
                if (el) el.value = value;
            }
        }
        
        saveLocalState();
    }

    function renderFinalModelTable() {
        try {
            state.colVis = getColVis();
            let currentOrder = getColOrder();
            
            const allCols = ['code', 'projectCode', 'discCode', 'bldgCode', 'lotCode', 'desc', 'comment'];
            allCols.forEach(c => {
                let cb = document.getElementById('vis-' + c);
                if (cb) cb.checked = state.colVis[c];
            });

            const models = buildModelsArray();
            const table = document.getElementById("final-model-table");
            if (!table) return;

            if (!models || models.length === 0) {
                table.innerHTML = `
                <thead class="bg-slate-50/80 text-slate-600 border-b border-slate-200 text-xs">
                    <tr><th class="py-4 px-3 font-bold text-center">תצוגה מקדימה של טבלת המודלים</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <tr><td class="p-6 text-center text-slate-400 font-medium">יש להוסיף מבנים ותחומים כדי ליצור מודלים.</td></tr>
                </tbody>`;
                return;
            }

            const colDef = {
                'code': { label: 'שם המודל ברישום', dir: 'ltr', width: '' },
                'projectCode': { label: 'קוד פרויקט', dir: 'ltr', width: '' },
                'discCode': { label: 'דיסציפלינה', dir: 'ltr', width: '' },
                'bldgCode': { label: 'מבנה / מרתף', dir: 'ltr', width: '' },
                'lotCode': { label: 'מגרש', dir: 'ltr', width: '' },
                'desc': { label: 'תיאור', dir: 'rtl', width: 'w-64' },
                'comment': { label: 'הערות הרישום', dir: 'rtl', width: 'w-64' }
            };

            let theadHtml = `
            <thead class="bg-slate-50/80 text-slate-600 border-b border-slate-200 text-xs select-none">
                <tr>
                    <th class="py-4 px-2 w-10 text-center"></th>`;
            
            currentOrder.forEach(col => {
                let visClass = state.colVis[col] ? '' : 'hidden';
                theadHtml += `<th id="th-${col}" draggable="true" ondragstart="handleColDragStart(event, '${col}')" ondragover="handleColDragOver(event)" ondrop="handleColDrop(event, '${col}')" ondragend="handleColDragEnd(event)" class="py-4 px-3 font-bold text-slate-800 cursor-move ${colDef[col].width} ${visClass}" title="גררו כדי לשנות את סדר העמודות">
                    <div class="flex items-center gap-2">
                        <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
                        ${colDef[col].label}
                    </div>
                </th>`;
            });
            
            theadHtml += `
                    <th class="py-4 px-3 font-bold text-slate-800">סריקת ACC</th>
                    <th class="py-4 px-2 w-10 text-center"></th>
                </tr>
            </thead>`;

            let tbodyHtml = `<tbody id="final-model-table-body" class="divide-y divide-slate-100">`;
            
            models.forEach(m => {
                if (!m) return;
                let safeCode = (m.code || "").replace(/"/g, '&quot;');
                let safeDisc = (m.discCode || "").replace(/"/g, '&quot;');
                let safeBldg = (m.bldgCode || "").replace(/"/g, '&quot;');
                let safeLot = (m.lotCode || "").replace(/"/g, '&quot;');
                let safeDesc = (m.desc || "").replace(/"/g, '&quot;');
                let safeComment = (m.comment || "").replace(/"/g, '&quot;');
                let safeProj = (m.projectCode || "").replace(/"/g, '&quot;');
                let isCustom = m.isCustom ? 'true' : 'false';

                tbodyHtml += `<tr draggable="true" ondragstart="handleRowDragStart(event, '${m.id}')" ondragover="handleRowDragOver(event)" ondrop="handleRowDrop(event, '${m.id}')" ondragend="handleRowDragEnd(event)" class="hover:bg-slate-50 transition align-middle bg-white group cursor-move">
                    <td class="py-2 px-2 text-slate-300 group-hover:text-blue-500 transition text-center" title="גררו כדי לשנות את סדר השורות">
                        <svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
                    </td>`;
